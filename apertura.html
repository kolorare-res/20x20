<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove - Diorama Pop-up</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh;
      background: #0d0d0d;
      overflow: hidden;
      display: flex; justify-content: center; align-items: center;
      perspective: 1200px;
    }

    /* Lo stage parte inclinato per simulare la pagina chiusa */
    #stage {
      width: 500px; height: 500px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(75deg) rotateY(-10deg) scale(0.6);
      opacity: 0;
      transition: transform 2.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.5s ease-out;
    }

    /* Stato aperto attivato via JS */
    #stage.aperto {
      transform: rotateX(0deg) rotateY(0deg) scale(1);
      opacity: 1;
    }

    .layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
      transition: transform 1.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Posizioni finali Pop-up sull'asse Z */
    #base     { transform: translateZ(0px); }
    #albero   { transform: translate3d(-18%, -4%, 0px) scale(0.85); }
    #lampione { transform: translate3d(12%, -2%, 0px) scale(0.85); mix-blend-mode: screen; }
    #lettore  { transform: translate3d(-15%, 15%, 0px) scale(0.7); }
    #lago     { transform: translate3d(5%, 22%, 0px) scale(0.55); }
    #barca    { transform: translate3d(5%, 23%, 0px) scale(0.32); }

    /* Classi animate per far risaltare i livelli in profondità */
    #stage.aperto #albero   { transform: translate3d(-18%, -4%, 30px) scale(0.85); }
    #stage.aperto #lampione { transform: translate3d(12%, -2%, 60px) scale(0.85); }
    #stage.aperto #lettore  { transform: translate3d(-15%, 15%, 80px) scale(0.7); }
    #stage.aperto #lago     { transform: translate3d(5%, 22%, 100px) scale(0.55); }
    #stage.aperto #barca    { 
      transform: translate3d(5%, 23%, 120px) scale(0.32); 
      animation: galleggia 2.5s ease-in-out infinite alternate 2.2s;
    }

    @keyframes galleggia {
      from { transform: translate3d(5%, 23%, 120px) scale(0.32); }
      to   { transform: translate3d(5%, 20%, 120px) scale(0.32); }
    }
  </style>
</head>
<body>

  <div id="stage">
    <img id="base" class="layer" src="assets/base.png" alt="Base">
    <img id="albero" class="layer" src="assets/layer6.png" alt="Albero">
    <img id="lampione" class="layer" src="assets/layer8.png" alt="Lampione">
    <img id="lettore" class="layer" src="assets/layer3.png" alt="Lettore">
    <img id="lago" class="layer" src="assets/layer9-middle.png" alt="Lago">
    <img id="barca" class="layer" src="assets/layer9-barca.png" alt="Barca">
  </div>

  <script>
    const stage = document.getElementById('stage');
    let animazioneCompletata = false;

    // 1. Avvio automatico dell'apertura al caricamento
    window.addEventListener('load', () => {
      setTimeout(() => {
        stage.classList.add('aperto');
        setTimeout(() => { animazioneCompletata = true; }, 2200);
      }, 300);
    });

    // 2. Interattività Parallasse (attiva solo a fine apertura per non spezzare la transizione)
    window.addEventListener('mousemove', (e) => {
      if (!animazioneCompletata) return;
      const x = (window.innerWidth / 2 - e.clientX) / 25;
      const y = (window.innerHeight / 2 - e.clientY) / 25;
      stage.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
    });

    window.addEventListener('deviceorientation', (e) => {
      if (!animazioneCompletata || !e.beta || !e.gamma) return;
      stage.style.transform = `rotateY(${e.gamma / 2}deg) rotateX(${e.beta / 2}deg)`;
    });
  </script>

</body>
</html>
