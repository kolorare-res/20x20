<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove - Test Apertura</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; }
    button { background: #fff; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 20px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="ui"><button id="btn-open">Apri Album</button></div>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -0.8, 2.5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const albumGroup = new THREE.Group();
    scene.add(albumGroup);

    // Pagina Inferiore (Base)
    const bottomGeo = new THREE.PlaneGeometry(1.2, 0.8);
    const bottomMat = new THREE.MeshBasicMaterial({ color: 0x333333, side: THREE.DoubleSide });
    const bottomPage = new THREE.Mesh(bottomGeo, bottomMat);
    bottomPage.position.set(0, -0.4, 0);
    albumGroup.add(bottomPage);

    // Cerniera centrale
    const topPivot = new THREE.Group();
    topPivot.position.set(0, 0, 0);
    albumGroup.add(topPivot);

    // Pagina Superiore (Mobile)
    const topGeo = new THREE.PlaneGeometry(1.2, 0.8);
    const topMat = new THREE.MeshBasicMaterial({ color: 0xcccccc, side: THREE.DoubleSide });
    const topPage = new THREE.Mesh(topGeo, topMat);
    topPage.position.set(0, 0.4, 0);
    topPivot.add(topPage);

    // Chiusa in partenza
    topPivot.rotation.x = Math.PI;

    // Pop-up di prova
    const popupGeo = new THREE.PlaneGeometry(0.4, 0.4);
    const popupMat = new THREE.MeshBasicMaterial({ color: 0x4caf50, side: THREE.DoubleSide });
    const popup = new THREE.Mesh(popupGeo, popupMat);
    popup.position.set(0, 0, 0.01);
    bottomPage.add(popup);

    let isOpen = false;
    document.getElementById('btn-open').addEventListener('click', () => {
      if (!isOpen) {
        gsap.to(topPivot.rotation, { x: 0, duration: 1.5, ease: "power2.inOut" });
        gsap.to(popup.position, { z: 0.3, duration: 1.2, delay: 0.3 });
        isOpen = true;
      } else {
        gsap.to(topPivot.rotation, { x: Math.PI, duration: 1.5, ease: "power2.inOut" });
        gsap.to(popup.position, { z: 0.01, duration: 1 });
        isOpen = false;
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
