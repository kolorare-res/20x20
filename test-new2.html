<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove - Teatro di Carta</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // 1. SMOOTH TRACKER (Interpolazione fluida del tracciamento)
    AFRAME.registerComponent('smooth-tracker', {
      schema: { factor: { type: 'number', default: 0.35 } },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;
        const object3D = this.el.object3D;
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }
        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });

    // 2. OPT-PLANE (Ottimizzazione Trasparenza e Materiale)
    AFRAME.registerComponent('opt-plane', {
      init: function () {
        this.el.setAttribute('material', { transparent: true, alphaTest: 0.1, side: 'double' });
      }
    });

    // 3. RIVELAZIONE PROGRESSIVA CORRETTA
    AFRAME.registerComponent('paper-theater-reveal', {
      schema: { duration: { type: 'number', default: 4000 } }, // 4 secondi
      init: function () {
        this.startTime = null;
        this.layers = Array.from(this.el.querySelectorAll('.reveal-layer'));
        
        // Legge le posizioni finali dagli attributi e inizializza la partenza schiacciata
        this.targetData = this.layers.map(layer => {
          const finalZ = parseFloat(layer.getAttribute('data-final-z'));
          const finalX = parseFloat(layer.getAttribute('data-final-x') || 0);
          const finalY = parseFloat(layer.getAttribute('data-final-y') || 0);
          
          // Imposta subito la posizione di partenza compressa vicino a zero sulla Z
          layer.object3D.position.set(finalX, finalY, 0.01);
          
          return {
            el: layer,
            x: finalX,
            y: finalY,
            z: finalZ
          };
        });
      },
      tick: function (time) {
        if (!this.startTime) this.startTime = time;
        const elapsed = time - this.startTime;
        const progress = Math.min(elapsed / this.data.duration, 1);
        
        // Easing cubico in uscita (rallenta dolcemente alla fine)
        const easeProgress = 1 - Math.pow(1 - progress, 3);

        this.targetData.forEach(item => {
          const currentZ = 0.01 + (item.z - 0.01) * easeProgress;
          item.el.object3D.position.z = currentZ;
        });

        // Congela definitivamente la scena a fine animazione
        if (progress >= 1) {
          this.remove();
        }
      }
    });
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5; autoStart: true;" 
    color-space="sRGB" 
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;" 
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="base-image" src="./ima/base.png" crossorigin="anonymous" />
      <img id="layer0" src="./ima/layer0.png" crossorigin="anonymous" />
      <img id="layer3" src="./ima/layer3.png" crossorigin="anonymous" />
      <img id="layer4" src="./ima/layer4.png" crossorigin="anonymous" />
      <img id="layer6" src="./ima/layer6.png" crossorigin="anonymous" />
      <img id="layer8" src="./ima/layer8.png" crossorigin="anonymous" />
      <img id="layer8-floor" src="./ima/layer8-floor.png" crossorigin="anonymous" />
      
      <!-- Asset Layer 9 -->
      <img id="layer9" src="./ima/layer9.png" crossorigin="anonymous" />
      <img id="layer9-barca" src="./ima/layer9-barca.png" crossorigin="anonymous" />
      <img id="layer9-over" src="./ima/layer9-over.png" crossorigin="anonymous" />
      <img id="layer9-floor" src="./ima/layer9-floor.png" crossorigin="anonymous" />
      <img id="layer9-middle" src="./ima/layer9-middle.png" crossorigin="anonymous" />
      <img id="layer9-top" src="./ima/layer9-top.png" crossorigin="anonymous" />

      <!-- Asset Layer 10 -->
      <img id="layer10" src="./ima/layer10.png" crossorigin="anonymous" />
      <img id="layer10-floor" src="./ima/layer10-floor.png" crossorigin="anonymous" />
      <img id="layer10-back" src="./ima/layer10-back.png" crossorigin="anonymous" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- TARGET ANCORAGGIO -->
    <a-entity mindar-image-target="targetIndex: 0" smooth-tracker="factor: 0.35" paper-theater-reveal="duration: 4000">
      
      <!-- BASE E LAYER 0 (Fissi sul fondo) -->
      <a-plane opt-plane id="BASE-PAVIMENTO" src="#base-image" position="0.000 -0.500 0.500" rotation="-90.0 0.0 0.0" width="1" height="1"></a-plane>
      <a-plane opt-plane id="LAYER-0" src="#layer0" position="0.000 0.000 0.010" rotation="0.0 0.0 0.0" width="1" height="1"></a-plane>
     
      <!-- QUINTE / LAYER INTERMEDI -->
      <a-plane class="reveal-layer" data-final-z="0.05" src="#layer3" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
      <a-plane class="reveal-layer" data-final-z="0.10" src="#layer4" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>

      <!-- GRUPPO LAYER 6 -->
      <a-entity class="reveal-layer" data-final-z="0.50" data-final-x="0.475" data-final-y="0.0" rotation="0.0 -30.5 0.0">
        <a-plane opt-plane src="#layer6" position="0 0 0" width="1" height="1"></a-plane>
      </a-entity>

      <!-- LAYER 8 E SUO FLOOR (Allineato correttamente in basso a y = -0.5) -->
      <a-plane class="reveal-layer" data-final-z="0.620" opt-plane id="LAYER-8" src="#layer8" rotation="0.0 45.0 0.0" width="1" height="1"></a-plane>
      <a-plane 
        class="reveal-layer"
        data-final-z="0.620"
        src="#layer8-floor" 
        position="0 -0.500 0" 
        rotation="-90 45.0 0" 
        width="1" height="0.20" 
        material="transparent: true; alphaTest: 0.1; side: double;">
      </a-plane>
      
      <!-- GRUPPO LAYER 9 (Include i floor interni della barca) -->
      <a-entity class="reveal-layer" data-final-z="0.530" rotation="0.0 -30.5 0.0">
        <a-plane opt-plane src="#layer9" position="0 0 0" width="1" height="1"></a-plane>
        <a-plane opt-plane src="#layer9-over" position="0 0 0.01" width="1" height="1"></a-plane>
        <a-plane opt-plane src="#layer9-barca" position="0 0 0.02" width="1" height="1"></a-plane>
        
        <a-plane opt-plane src="#layer9-top" position="0 0.094 0.005" rotation="-90 0 0" width="1" height="0.45"></a-plane>
        <a-plane opt-plane src="#layer9-middle" position="0 -0.11 0.005" rotation="-90 0 0" width="1" height="0.35"></a-plane>
        <a-plane opt-plane src="#layer9-floor" position="0 -0.500 0.005" rotation="-90 0 0" width="1" height="0.30"></a-plane>
      </a-entity>

      <!-- GRUPPO LAYER 10 E SUO FLOOR (Allineato correttamente in basso a y = -0.5) -->
      <a-plane class="reveal-layer" data-final-z="0.80" src="#layer10" rotation="0.0 23 0.0" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
      <a-plane class="reveal-layer" data-final-z="0.88" src="#layer10-back" rotation="0.0 23 0.0" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
      <a-plane 
        class="reveal-layer"
        data-final-z="0.88"
        src="#layer10-floor" 
        position="0 -0.500 0" 
        rotation="-90 0 0" 
        width="1" height="0.12" 
        material="transparent: true; alphaTest: 0.1; side: double;">
      </a-plane>
      
    </a-entity>
  </a-scene>
</body>
</html>
