<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove - CSS3D Parallax</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw; height: 100vh;
      background: #111;
      overflow: hidden;
      display: flex; justify-content: center; align-items: center;
      perspective: 1000px; /* Profondità della camera 3D */
    }

    #stage {
      width: 400px; height: 400px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
    }

    .layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Posizionamento dei vari livelli sull'asse Z */
    #base { transform: translateZ(0px); }
    #albero { transform: translate3d(-10%, -5%, 40px) scale(0.9); }
    #lampione { transform: translate3d(10%, 0%, 80px) scale(0.9); }
    #lago { transform: translate3d(-15%, 15%, 120px) scale(0.85); }
    #barca {
      transform: translate3d(-12%, 18%, 150px) scale(0.5);
      animation: galleggia 2.5s ease-in-out infinite alternate;
    }

    @keyframes galleggia {
      from { transform: translate3d(-12%, 18%, 150px) scale(0.5); }
      to   { transform: translate3d(-12%, 15%, 150px) scale(0.5); }
    }
  </style>
</head>
<body>

  <div id="stage">
    <!-- 1. Sfondo Base -->
    <img id="base" class="layer" src="assets/base.png" alt="Base">

    <!-- 2. Vegetazione -->
    <img id="albero" class="layer" src="assets/layer6.png" alt="Albero">

    <!-- 3. Lampione e Luce -->
    <img id="lampione" class="layer" src="assets/layer8.png" alt="Lampione">

    <!-- 4. Lago e Barca -->
    <img id="lago" class="layer" src="assets/layer9-middle.png" alt="Lago">
    <img id="barca" class="layer" src="assets/layer9-barca.png" alt="Barca">
  </div>

  <script>
    // Interattività: Ruota la scena al movimento del mouse/touch per far risaltare il 3D
    const stage = document.getElementById('stage');
    
    window.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth / 2 - e.clientX) / 20;
      const y = (window.innerHeight / 2 - e.clientY) / 20;
      stage.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
    });

    window.addEventListener('deviceorientation', (e) => {
      if (e.beta && e.gamma) {
        stage.style.transform = `rotateY(${e.gamma / 2}deg) rotateX(${e.beta / 2}deg)`;
      }
    });
  </script>

</body>
</html>
