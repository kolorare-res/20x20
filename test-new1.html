<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Composizione Assets Diretti</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #111; }
  </style>
</head>
<body>

  <a-scene vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 1.2" look-controls="enabled: true" wasd-controls="enabled: false"></a-camera>

    <a-entity id="opera" position="0 0 0">
      
      <!-- 1. SFONDO BASE -->
      <a-plane position="0 0 0" width="0.8" height="0.8" src="assets/base.png" material="transparent: true; alphaTest: 0.5; side: double"></a-plane>

      <!-- 2. LAMPIONE + CONO DI LUCE -->
      <a-entity id="gruppo-lampione" position="0.18 0.05 0.08">
        <a-plane width="0.4" height="0.6" src="assets/layer8.png" material="transparent: true; alphaTest: 0.5; side: double"></a-plane>
        
        <a-cone 
          position="-0.12 -0.1 0.02" 
          radius-bottom="0.2" 
          radius-top="0.01" 
          height="0.5" 
          rotation="0 0 45" 
          material="color: #fbd532; transparent: true; opacity: 0.4; depthWrite: false; side: double">
        </a-cone>
      </a-entity>

      <!-- 3. BASE LAGO + BARCA -->
      <a-entity id="gruppo-acqua" position="-0.18 -0.2 0.12">
        <a-plane width="0.4" height="0.3" src="assets/layer9-middle.png" material="transparent: true; alphaTest: 0.5; side: double"></a-plane>
        
        <a-plane 
          id="barca" 
          width="0.2" 
          height="0.15" 
          src="assets/layer9-barca.png" 
          position="0 0.02 0.03" 
          material="transparent: true; alphaTest: 0.5; side: double"
          animation="property: position; to: 0 0.035 0.03; dir: alternate; dur: 2200; loop: true; easing: sine">
        </a-plane>
      </a-entity>

      <!-- 4. LETTERE FLUTTUANTI -->
      <a-text value="A" position="0.1 0.2 0.1" scale="0.15 0.15 0.15" color="#1a1a1a"
              animation="property: position; to: -0.1 -0.15 0.1; dur: 4500; loop: true; easing: linear">
      </a-text>

      <a-text value="M" position="-0.02 0.25 0.09" scale="0.13 0.13 0.13" color="#1a1a1a"
              animation="property: position; to: -0.2 -0.1 0.09; dur: 5500; loop: true; easing: linear; delay: 800">
      </a-text>

    </a-entity>

  </a-scene>

</body>
</html>
