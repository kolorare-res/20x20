<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Composizione 3D - Corretto</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #111; }
  </style>
</head>
<body>

  <a-scene vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 1.2" look-controls="enabled: true" wasd-controls="enabled: false"></a-camera>

    <!-- Sfondo della Stampa 20x20 -->
    <a-plane position="0 0 0" width="0.8" height="0.8" color="#f4f1ea" material="side: double"></a-plane>

    <!-- LAMPIONE (Posizionato in alto a destra) -->
    <a-entity id="lampione" position="0.22 0.1 0.05" rotation="0 0 -20">
      <!-- Palo -->
      <a-cylinder position="0 0 0" radius="0.006" height="0.45" color="#1a1a1a"></a-cylinder>
      <!-- Testa della Lampada -->
      <a-cone position="0 0.225 0" radius-bottom="0.03" radius-top="0.01" height="0.03" color="#1a1a1a"></a-cone>
      
      <!-- CONO DI LUCE: Parte dalla lampada e proietta verso il basso a sinistra -->
      <a-cone 
        position="-0.15 -0.05 0.08" 
        radius-bottom="0.22" 
        radius-top="0.01" 
        height="0.55" 
        rotation="0 0 55" 
        material="color: #fbd532; transparent: true; opacity: 0.45; depthWrite: false; side: double">
      </a-cone>
    </a-entity>

    <!-- BACINO D'ACQUA E BARCA (In basso a sinistra) -->
    <a-entity id="acqua-barca" position="-0.18 -0.22 0.08">
      <!-- Specchio d'acqua (Molto più sottile) -->
      <a-cylinder position="0 0 0" radius="0.18" height="0.003" material="color: #2b5c8f; transparent: true; opacity: 0.8"></a-cylinder>
      
      <!-- Barca animata -->
      <a-entity id="barca" position="0 0.01 0" animation="property: position; to: 0 0.025 0; dir: alternate; dur: 2200; loop: true; easing: sine">
        <!-- Scafo -->
        <a-cone radius-bottom="0.04" radius-top="0.01" height="0.025" rotation="180 0 0" scale="1 1 2.2" color="#3e2723"></a-cone>
        <!-- Vela -->
        <a-triangle vertex-a="0 0.07 0" vertex-b="-0.035 0 0" vertex-c="0.035 0 0" color="#f4f1ea" material="side: double" position="0 0.02 0"></a-triangle>
      </a-entity>
    </a-entity>

    <!-- PAROLE FLUTTUANTI (Attraversano la luce) -->
    <a-text value="A" position="0.1 0.2 0.12" scale="0.15 0.15 0.15" color="#1a1a1a"
            animation="property: position; to: -0.1 -0.15 0.12; dur: 4500; loop: true; easing: linear">
    </a-text>

    <a-text value="M" position="-0.02 0.25 0.08" scale="0.13 0.13 0.13" color="#1a1a1a"
            animation="property: position; to: -0.2 -0.1 0.08; dur: 5500; loop: true; easing: linear; delay: 800">
    </a-text>

  </a-scene>

</body>
</html>
