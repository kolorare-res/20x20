<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Layout WebGL</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #222; }
  </style>
</head>
<body>

  <!-- WebGL1 e Shader Flat per evitare schermate nere da driver GPU -->
  <a-scene embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 1.2" look-controls="enabled: true" wasd-controls="enabled: false"></a-camera>

    <a-entity id="opera" position="0 0 0">
      
      <!-- SFONDO BASE (Rosso tenue per verificare che il piano Z=0 sia visibile) -->
      <a-plane position="0 0 0" width="0.8" height="0.8" material="color: #4a2e2e; shader: flat; side: double"></a-plane>

      <!-- LAMPIONE (Rettangolo Giallo) -->
      <a-entity position="0.18 0.05 0.08">
        <a-plane width="0.3" height="0.5" material="color: #e0d068; shader: flat; side: double"></a-plane>
      </a-entity>

      <!-- BASE LAGO + BARCA (Rettangolo Blu) -->
      <a-entity position="-0.18 -0.2 0.12">
        <a-plane width="0.4" height="0.2" material="color: #3b6e8c; shader: flat; side: double"></a-plane>
      </a-entity>

      <!-- TESTO BIANCO -->
      <a-text value="TEST OK" position="-0.15 0 0.15" scale="0.3 0.3 0.3" color="#ffffff"></a-text>

    </a-entity>

  </a-scene>

</body>
</html>
