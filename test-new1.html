<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 100vw; height: 100vh;
    background: #111;
    overflow: hidden;
    display: flex; justify-content: center; align-items: center;
    perspective: 1200px;
  }

  #stage {
    width: 500px; height: 500px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.1s ease-out;
  }

  .layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
  }

  /* 1. SFONDO BASE */
  #base { 
    transform: translateZ(0px); 
  }

  /* 2. ALBERO (In alto a sinistra) */
  #albero { 
    transform: translate3d(-18%, -4%, 30px) scale(0.85); 
  }

  /* 3. LAMPIONE (Ridimensionato e riallineato a destra) */
  #lampione { 
    transform: translate3d(12%, -2%, 60px) scale(0.85); 
    mix-blend-mode: screen; 
  }

  /* 4. LAGO (Spostato a destra per centrarlo al fascio di luce) */
  #lago { 
    transform: translate3d(-2%, 24%, 90px) scale(0.6); 
  }

  /* 5. BARCA (Posizionata al centro del lago con galleggiamento) */
  #barca {
    transform: translate3d(-3%, 25%, 120px) scale(0.35);
    animation: galleggia 2.5s ease-in-out infinite alternate;
  }

  @keyframes galleggia {
    from { transform: translate3d(-3%, 25%, 120px) scale(0.35); }
    to   { transform: translate3d(-3%, 22%, 120px) scale(0.35); }
  }
</style>
