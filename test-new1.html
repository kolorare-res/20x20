<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove - Foglie in Primo Piano</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // 1. SMOOTH TRACKER (Interpolazione fluida per eliminare scatti)
    AFRAME.registerComponent('smooth-tracker', {
      schema: { factor: { type: 'number', default: 0.35 } },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;
        const object3D = this.el.object3D;
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }
        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });

    // 2. OPT-PLANE (Ottimizzazione Trasparenza e Materiale)
    AFRAME.registerComponent('opt-plane', {
      init: function () {
        this.el.setAttribute('material', { transparent: true, alphaTest: 0.1, side: 'double' });
      }
    });

    // 3. BARCA (Pitching e Oscillazione)
    AFRAME.registerComponent('boat-pitch', {
      schema: { pitchDeg: { type: 'number', default: 4 }, bobY: { type: 'number', default: 0.008 }, speed: { type: 'number', default: 0.0018 } },
      init: function () { this.baseY = this.el.object3D.position.y; this.time = 0; },
      tick: function (t, dt) {
        if (!dt) return;
        this.time += dt * this.data.speed;
        this.el.object3D.position.y = this.baseY + Math.sin(this.time) * this.data.bobY;
        this.el.object3D.rotation.z = THREE.MathUtils.degToRad(Math.cos(this.time) * this.data.pitchDeg);
      }
    });

    // 4. FOGLIE CADENTI
    AFRAME.registerComponent('falling-particles', {
      schema: {
        count: { type: 'int', default: 18 },
        zPos: { type: 'number', default: 0.08 },
        zVariance: { type: 'number', default: 0.04 },
        assetFolder: { type: 'string', default: './ima/foglie/' },
        assetPrefix: { type: 'string', default: 'layer6-foglie-' }
      },
      init: function () {
        this.particles = [];
        this.bounds = { xMin: -0.2, xMax: 0.2, yMin: -0.2, yMax: 0.2, yKill: -0.5 };

        for (let i = 0; i < this.data.count; i++) {
          const pEl = document.createElement('a-plane');
          const num = Math.floor(Math.random() * 18 + 1).toString().padStart(2, '0');
          const size = 0.015 + Math.random() * 0.035;
          
          pEl.setAttribute('width', size);
          pEl.setAttribute('height', size);
          pEl.setAttribute('opt-plane', '');
          pEl.setAttribute('material', 'src', `${this.data.assetFolder}${this.data.assetPrefix}${num}.png`);

          this.el.appendChild(pEl);

          this.particles.push({
            el: pEl,
            xInit: this.rand(this.bounds.xMin, this.bounds.xMax),
            x: 0,
            y: this.rand(this.bounds.yMin, this.bounds.yMax),
            z: this.data.zPos + (Math.random() * this.data.zVariance - (this.data.zVariance / 2)),
            fallSpeed: 0.0005 + Math.random() * 0.0004,
            swayAmp: 0.02 * (0.8 + Math.random() * 0.4),
            swayFreq: 0.0018 + Math.random() * 0.0015,
            rotSpeedZ: (Math.random() - 0.5) * 1.5,
            rotZ: Math.random() * 360,
            timeOffset: Math.random() * 2000
          });
        }
      },
      rand: (min, max) => min + Math.random() * (max - min),
      tick: function (time, dt) {
        if (!dt) return;
        this.particles.forEach(p => {
          p.y -= p.fallSpeed * (dt / 16.6);
          p.x = p.xInit + Math.sin((time + p.timeOffset) * p.swayFreq) * p.swayAmp;
          p.rotZ += p.rotSpeedZ;

          p.el.object3D.position.set(p.x, p.y, p.z);
          p.el.object3D.rotation.z = THREE.MathUtils.degToRad(p.rotZ);

          if (p.y < this.bounds.yKill) {
            p.xInit = this.rand(this.bounds.xMin, this.bounds.xMax);
            p.y = this.bounds.yMax;
          }
        });
      }
    });

    // 5. FARFALLA 3D (VOLO E BATTITO)
    AFRAME.registerComponent('butterfly-3d-flight', {
      schema: {
        radiusX: { type: 'number', default: 0.14 },
        radiusY: { type: 'number', default: 0.09 },
        flapAngle: { type: 'number', default: 50 },
        flapSpeed: { type: 'number', default: 0.012 },
        flightSpeed: { type: 'number', default: 0.001 }
      },
      init: function () {
        this.baseX = this.el.object3D.position.x;
        this.baseY = this.el.object3D.position.y;
        this.timeFlight = 0;
        this.timeFlap = Math.random() * 100;
        this.wingLeft = this.el.querySelector('.wing-left');
        this.wingRight = this.el.querySelector('.wing-right');
      },
      tick: function (t, dt) {
        if (!dt) return;
        this.timeFlight += dt * this.data.flightSpeed;
        this.timeFlap += dt * this.data.flapSpeed;

        const offsetX = Math.sin(this.timeFlight) * this.data.radiusX;
        const offsetY = Math.cos(this.timeFlight * 0.7) * this.data.radiusY;
        this.el.object3D.position.x = this.baseX + offsetX;
        this.el.object3D.position.y = this.baseY + offsetY;

        const currentFlap = Math.sin(this.timeFlap) * this.data.flapAngle;
        if (this.wingLeft) this.wingLeft.object3D.rotation.y = THREE.MathUtils.degToRad(currentFlap);
        if (this.wingRight) this.wingRight.object3D.rotation.y = THREE.MathUtils.degToRad(-currentFlap);

        const heading = Math.atan2(
          Math.cos(this.timeFlight * 0.7) * this.data.radiusY * 0.7,
          Math.cos(this.timeFlight) * this.data.radiusX
        );
        this.el.object3D.rotation.z = heading - Math.PI / 2;
      }
    });

// PULVISCOLO TIPOGRAFICO SERIF (Fix Definitivo: MSDF Shader + Percorsi Locali + Posizionamento 3D)
AFRAME.registerComponent('typo-cloud', {
  schema: {
    clusters: { type: 'int', default: 6 },
    totalChars: { type: 'int', default: 220 },
    boundsX: { type: 'number', default: 1.4 },
    boundsY: { type: 'number', default: 1.2 },
    boundsZ: { type: 'number', default: 0.8 },
    minScale: { type: 'number', default: 0.05 },
    maxScale: { type: 'number', default: 0.15 },
    color: { type: 'string', default: '#F4E8D5' },
    font: { type: 'string', default: './fonts/PlayfairDisplay-Regular.json' },
    fontImage: { type: 'string', default: './fonts/PlayfairDisplay-Regular.png' },
    driftSpeed: { type: 'number', default: 0.0005 },
    charSet: { type: 'string', default: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789' }
  },
  init: function () {
    this.nodes = [];
    const chars = Array.from(this.data.charSet);

    // Centri dei cluster distribuiti correttamente nello spazio
    const clusterCenters = [];
    for (let i = 0; i < this.data.clusters; i++) {
      clusterCenters.push({
        x: (Math.random() - 0.5) * this.data.boundsX * 0.7,
        y: (Math.random() - 0.2) * this.data.boundsY * 0.6,
        z: (Math.random() - 0.3) * this.data.boundsZ * 0.8,
        radius: 0.25 + Math.random() * 0.3
      });
    }

    for (let i = 0; i < this.data.totalChars; i++) {
      // Uso di a-entity per evitare conflitti con la primitiva a-text
      const charEl = document.createElement('a-entity');
      const randomChar = chars[Math.floor(Math.random() * chars.length)];
      
      let posX, posY, posZ;

      if (Math.random() < 0.70) {
        const center = clusterCenters[Math.floor(Math.random() * clusterCenters.length)];
        const u = Math.random();
        const r = center.radius * Math.cbrt(u);
        const theta = Math.random() * 2 * Math.PI;
        const phi = Math.acos(2 * Math.random() - 1);

        posX = center.x + r * Math.sin(phi) * Math.cos(theta);
        posY = center.y + r * Math.sin(phi) * Math.sin(theta);
        posZ = center.z + r * Math.cos(phi);
      } else {
        posX = (Math.random() - 0.5) * this.data.boundsX;
        posY = (Math.random() - 0.3) * this.data.boundsY;
        posZ = (Math.random() - 0.5) * this.data.boundsZ;
      }

      const scale = this.data.minScale + Math.random() * (this.data.maxScale - this.data.minScale);
      const baseOpacity = 0.45 + Math.random() * 0.50;

      // Configurazione text con shader msdf attivo e trasparenza corretta
      charEl.setAttribute('text', {
        value: randomChar,
        align: 'center',
        anchor: 'center',
        font: this.data.font,
        fontImage: this.data.fontImage,
        shader: 'msdf',
        color: this.data.color,
        side: 'double',
        opacity: baseOpacity,
        transparent: true,
        negate: false
      });

      charEl.setAttribute('scale', `${scale} ${scale} ${scale}`);
      charEl.setAttribute('position', `${posX} ${posY} ${posZ}`);
      charEl.setAttribute('rotation', `${(Math.random() - 0.5) * 20} ${(Math.random() - 0.5) * 40} 0`);

      this.el.appendChild(charEl);

      this.nodes.push({
        el: charEl,
        basePos: { x: posX, y: posY, z: posZ },
        rotY: (Math.random() - 0.5) * 0.3,
        freq: 0.7 + Math.random() * 1.2,
        phase: Math.random() * Math.PI * 2,
        amp: 0.015 + Math.random() * 0.025
      });
    }
  },
  tick: function (time, dt) {
    if (!dt) return;

    this.nodes.forEach(node => {
      const t = time * this.data.driftSpeed * node.freq + node.phase;
      
      const offsetX = Math.sin(t) * node.amp;
      const offsetY = Math.cos(t * 0.8) * node.amp * 1.2;
      const offsetZ = Math.sin(t * 1.2) * node.amp;

      node.el.object3D.position.x = node.basePos.x + offsetX;
      node.el.object3D.position.y = node.basePos.y + offsetY;
      node.el.object3D.position.z = node.basePos.z + offsetZ;

      node.el.object3D.rotation.y += node.rotY * 0.003;
    });
  }
});
    
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    .mindar-ui-loading, 
    div[class*="mindar-ui-loading"] {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }
    .mindar-ui-overlay, 
    div[class*="mindar-ui"] {
      background: transparent !important;
      background-color: transparent !important;
    }
  </style>
</head>

<body>
  <!-- SCENA CON FILTRI MINDAR E RENDERER STABILI -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5; autoStart: true; uiLoading: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;" 
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="base-image" src="./ima/base.png" crossorigin="anonymous" />
      <img id="layer0" src="./ima/layer0.png" crossorigin="anonymous" />
      <img id="layer3" src="./ima/layer3.png" crossorigin="anonymous" />
      <img id="layer4" src="./ima/layer4.png" crossorigin="anonymous" />
      <img id="layer6" src="./ima/layer6.png" crossorigin="anonymous" />
      <img id="layer8" src="./ima/layer8.png" crossorigin="anonymous" />
      <img id="layer8-floor" src="./ima/layer8-floor.png" crossorigin="anonymous" />
      
      <!-- Asset Layer 9 -->
      <img id="layer9" src="./ima/layer9.png" crossorigin="anonymous" />
      <img id="layer9-barca" src="./ima/layer9-barca.png" crossorigin="anonymous" />
      <img id="layer9-over" src="./ima/layer9-over.png" crossorigin="anonymous" />
      <img id="layer9-floor" src="./ima/layer9-floor.png" crossorigin="anonymous" />
      <img id="layer9-middle" src="./ima/layer9-middle.png" crossorigin="anonymous" />
      <img id="layer9-top" src="./ima/layer9-top.png" crossorigin="anonymous" />

      <!-- Asset Layer 10 -->
      <img id="layer10" src="./ima/layer10.png" crossorigin="anonymous" />
      <img id="layer10-floor" src="./ima/layer10-floor.png" crossorigin="anonymous" />
      <img id="layer10-back" src="./ima/layer10-back.png" crossorigin="anonymous" />

      <img id="butterfly-body" src="./ima/butterfly-body.png" crossorigin="anonymous" />
      <img id="butterfly-wing-left" src="./ima/butterfly-wing-left.png" crossorigin="anonymous" />
      <img id="butterfly-wing-right" src="./ima/butterfly-wing-right.png" crossorigin="anonymous" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- TARGET ANCORAGGIO CON SMOOTH-TRACKER ATTIVATO -->
    <a-entity mindar-image-target="targetIndex: 0" smooth-tracker="factor: 0.35">
      
      <!-- BASE E LAYER 0 -->
      <a-plane opt-plane id="BASE-PAVIMENTO" src="#base-image" position="0.000 -0.500 0.500" rotation="-90.0 0.0 0.0" width="1" height="1"></a-plane>
      <a-plane opt-plane id="LAYER-0" src="#layer0" position="0.000 0.000 0.010" rotation="0.0 0.0 0.0" width="1" height="1"></a-plane>
     
      <!-- LAYER 3 e 4 -->
      <a-plane src="#layer3" position="0 0 0.05" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
      <a-plane src="#layer4" position="0 0 0.10" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>

      <!-- GRUPPO LAYER 6 + FOGLIE IN AVANTI -->
      <a-entity id="GROUP-LAYER-6" position="0.475 0.000 0.500" rotation="0.0 -30.5 0.0">
        <a-plane opt-plane src="#layer6" position="0 0 0" width="1" height="1"></a-plane>
        <a-entity falling-particles="zPos: 0.08; zVariance: 0.04;"></a-entity>
      </a-entity>

      <!-- LAYER 8 -->
      <a-plane opt-plane id="LAYER-8" src="#layer8" position="0.000 0.000 0.620" rotation="0.0 45.0 0.0" width="1" height="1"></a-plane>
      <a-plane 
        src="#layer8-floor" 
        position="0 -0.499 0.620" 
        rotation="-90 45.0 0" 
        width="1" height="0.20" 
        material="transparent: true; alphaTest: 0.1; side: double;">
      </a-plane>
      
      <!-- GRUPPO LAYER 9 -->
      <a-entity id="GROUP-LAYER-9" position="0.000 0.000 0.530" rotation="0.0 -30.5 0.0">
        <a-plane opt-plane src="#layer9" position="0 0 0" width="1" height="1"></a-plane>
        <a-plane opt-plane src="#layer9-over" position="0 0 0.01" width="1" height="1"></a-plane>
        <a-plane opt-plane src="#layer9-barca" position="0 0 0.02" width="1" height="1" boat-pitch></a-plane>
        
        <a-plane opt-plane src="#layer9-top" position="0 0.094 0.005" rotation="-90 0 0" width="1" height="0.45"></a-plane>
        <a-plane opt-plane src="#layer9-middle" position="0 -0.11 0.005" rotation="-90 0 0" width="1" height="0.35"></a-plane>
        <a-plane opt-plane src="#layer9-floor" position="0 -0.499 0.005" rotation="-90 0 0" width="1" height="0.30"></a-plane>
      </a-entity>

      <!-- GRUPPO LAYER 10 -->
      <a-plane src="#layer10" position="0 0 0.9" rotation="0.0 23 0.0" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
      <a-plane src="#layer10-back" position="0 0 0.88" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
      <a-plane 
        src="#layer10-floor" 
        position="0 -0.499 0.88" 
        rotation="-90 0 0" 
        width="1" height="0.12" 
        material="transparent: true; alphaTest: 0.1; side: double;">
      </a-plane>

      <!-- FARFALLA 1 (Abbassata sull'asse Y) -->
      <a-entity position="0.28 -0.15 1.05" butterfly-3d-flight>
        <a-plane opt-plane src="#butterfly-body" width="0.02" height="0.07"></a-plane>
        <a-entity class="wing-left" position="-0.002 0 0.001">
          <a-plane opt-plane src="#butterfly-wing-left" position="-0.035 0 0" width="0.07" height="0.07"></a-plane>
        </a-entity>
        <a-entity class="wing-right" position="0.002 0 0.002">
          <a-plane opt-plane src="#butterfly-wing-right" position="0.035 0 0" width="0.07" height="0.07"></a-plane>
        </a-entity>
      </a-entity>
      
<!-- PULVISCOLO TIPOGRAFICO ATMOSFERICO -->
<a-entity 
  typo-cloud="clusters: 6; totalChars: 220; minScale: 0.05; maxScale: 0.15; color: #F4E8D5;" 
  position="0 0.20 0.40">
</a-entity>
      
    </a-entity>
  </a-scene>
</body>
</html>
