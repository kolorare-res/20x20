<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Composizione 3D</title>
  <!-- Usiamo la versione 1.3.0 che non si blocca sui tre puntini -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111;
    }
  </style>
</head>
<body>

  <a-scene vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 1.2" look-controls="enabled: true" wasd-controls="enabled: false"></a-camera>

    <!-- Sfondo chiaro per verificare la composizione -->
    <a-plane position="0 0 0" width="0.8" height="0.8" color="#f4f1ea" material="side: double"></a-plane>

    <!-- Lampione e Cono di Luce -->
    <a-cylinder position="0.25 0.1 0.1" radius="0.008" height="0.5" color="#1a1a1a" rotation="0 0 -15"></a-cylinder>
    <a-cone position="0.08 -0.05 0.15" radius-bottom="0.25" radius-top="0.01" height="0.5" rotation="0 0 35" material="color: #fbd532; transparent: true; opacity: 0.5; depthWrite: false; side: double"></a-cone>

    <!-- Barca e Acqua -->
    <a-cylinder position="-0.18 -0.2 0.1" radius="0.16" height="0.015" material="color: #2b5c8f; transparent: true; opacity: 0.85"></a-cylinder>
    
    <a-entity id="barca" position="-0.18 -0.18 0.12" animation="property: position; to: -0.18 -0.16 0.12; dir: alternate; dur: 2500; loop: true; easing: sine">
      <a-cone radius-bottom="0.04" radius-top="0" height="0.03" rotation="0 0 180" scale="1 1 2" color="#3e2723"></a-cone>
      <a-triangle vertex-a="0 0.06 0" vertex-b="-0.03 0 0" vertex-c="0.03 0 0" color="#f4f1ea" material="side: double" position="0 0.03 0"></a-triangle>
    </a-entity>

    <!-- Lettere/Particelle in caduta -->
    <a-text value="A" position="0.15 0.25 0.18" scale="0.15 0.15 0.15" color="#1a1a1a"
            animation="property: position; to: -0.05 -0.2 0.18; dur: 4500; loop: true; easing: linear; delay: 200"
            animation__rotation="property: rotation; to: 0 360 45; dur: 4500; loop: true; easing: linear">
    </a-text>

    <a-text value="M" position="0.0 0.28 0.12" scale="0.14 0.14 0.14" color="#1a1a1a"
            animation="property: position; to: -0.15 -0.18 0.12; dur: 5200; loop: true; easing: linear; delay: 1000"
            animation__rotation="property: rotation; to: 180 180 0; dur: 5200; loop: true; easing: linear">
    </a-text>

  </a-scene>

</body>
</html>
