<!DOCTYPE html>
<html lang="it">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame Framework -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- MindAR Library per A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
      AFRAME.registerComponent('custom-texture', {
        schema: {
          coverSrc: { type: 'selector', default: '#texture-copertina' },
          pagesSrc: { type: 'selector', default: '#texture-pagine' }
        },
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            if (!mesh) return;

            const loader = new THREE.TextureLoader();
            
            if (this.data.coverSrc) {
              const coverTex = loader.load(this.data.coverSrc.src);
              coverTex.encoding = THREE.sRGBEncoding;
              coverTex.flipY = false;
            }

            if (this.data.pagesSrc) {
              const pagesTex = loader.load(this.data.pagesSrc.src);
              pagesTex.encoding = THREE.sRGBEncoding;
              pagesTex.flipY = false;
            }

            mesh.traverse((node) => {
              if (node.isMesh && node.material) {
                node.material.needsUpdate = true;
              }
            });
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; autoStart: true; uiLoading: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;" 
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <img id="texture-copertina" src="copertina.png" crossorigin="anonymous">
        <img id="texture-pagine" src="pagine.png" crossorigin="anonymous">

        <a-asset-item id="libro3D" src="data:model/gltf-binary;base64,gLTFggEAAAA8AQAAAAAAAIA/AAAAAAAAAAAAAAAAAAAAAAABAAAAAQAAAAAAAABgP319vT8AAIA/AAAAAIA/AACA/wAAAAAAAACAPwAAgD8AAAAAAACAPwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGAEAAAEAAAAAAAAAAAAAAAACAAAAAAAAAAMAAAAAAAAABAAAAAAAAAAFAAAAAAAAAAYAAAAAAAAABwAAAAAAAAAIAAAAAAAAAAkAAAAAAAAACgAAAAAAAAALAAAAAAAAAA0AAAAAAAAADgAAAAAAAAAPAAAAAAAAABAAAAAAAAAREAAAAB4AAAA="></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-light type="directional" intensity="1.2" position="1 2 1"></a-light>
        <a-light type="ambient" intensity="0.6"></a-light>

        <a-gltf-model 
          src="#libro3D" 
          custom-texture="coverSrc: #texture-copertina; pagesSrc: #texture-pagine"
          position="0 0 0.1" 
          rotation="45 0 0" 
          scale="1 1 1">
        </a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
