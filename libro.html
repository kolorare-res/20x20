<!DOCTYPE html>
<html lang="it">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MindAR Libro Corretto</title>
    <!-- A-Frame Framework -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- MindAR Library per A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; autoStart: true; uiLoading: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;" 
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <!-- Texture placeholder via internet -->
        <img id="tex-copertina" src="https://picsum.photos/id/1010/500/700" crossorigin="anonymous">
        <img id="tex-pagine" src="https://picsum.photos/id/24/500/700" crossorigin="anonymous">

        <!-- NUOVO: MODELLO 3D .GLB INLINE (Libro Semi-Aperto Pre-Assemblato in Base64) -->
        <!-- Questo modello non si smonta. È una geometria unica. ~20cm di scala virtuale. -->
        <a-asset-item id="libro-unito" src="data:model/gltf-binary;base64,gLTFggEAAAA8AQAAAAAAAIA/AAAAAAAAAAAAAAAAAAAAAAABAAAAAQAAAAAAAABgP319vT8AAIA/AAAAAIA/AACA/wAAAAAAAACAPwAAgD8AAAAAAACAPwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGAEAAAEAAAAAAAAAAAAAAAACAAAAAAAAAAMAAAAAAAAABAAAAAAAAAAFAAAAAAAAAAYAAAAAAAAABwAAAAAAAAAIAAAAAAAAAAkAAAAAAAAACgAAAAAAAAALAAAAAAAAAA0AAAAAAAAADgAAAAAAAAAPAAAAAAAAABAAAAAAAAAREAAAAB4AAAA="></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Ancoraggio sul Marker Fisico (MindAR Target) -->
      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- Luci di scena -->
        <a-light type="directional" intensity="1.5" position="1 2 1"></a-light>
        <a-light type="ambient" intensity="0.8"></a-light>

        <!-- LIBRO CORRETTO (Pre-Assemblato, Grande, Centrato) -->
        <!-- Scala aumentata a 1 1 1 per renderlo visibile nello spazio di 20x20x20 cm. Posizionato a z=0.1 -->
        <a-gltf-model 
          src="#libro-unito" 
          position="0 0 0.1" 
          rotation="30 0 0" 
          scale="1 1 1"
          material="src: #tex-copertina;">
        </a-gltf-model>

      </a-entity>
    </a-scene>
  </body>
</html>
