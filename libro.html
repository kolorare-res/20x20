<!DOCTYPE html>
<html lang="it">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame Framework -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- MindAR Library per A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; autoStart: true; uiLoading: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;" 
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <!-- Texture Generiche placeholder via internet -->
        <img id="tex-copertina" src="https://picsum.photos/id/1010/500/700" crossorigin="anonymous">
        <img id="tex-pagine" src="https://picsum.photos/id/24/500/700" crossorigin="anonymous">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Ancoraggio sul Marker Fisico (MindAR Target) -->
      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- Luci di scena per rendere nitidi i volumi 3D -->
        <a-light type="directional" intensity="1.2" position="1 2 1"></a-light>
        <a-light type="ambient" intensity="0.7"></a-light>

        <!-- GRUPPO LIBRO SEMI-APERTO (Dimensione ~20cm, centrato nello spazio) -->
        <a-entity position="0 0 0.1" rotation="30 0 0" scale="0.18 0.18 0.18">
          
          <!-- Dorso del Libro -->
          <a-cylinder 
            position="0 -0.5 0" 
            rotation="0 0 90" 
            radius="0.08" 
            height="0.7" 
            color="#8B4513">
          </a-cylinder>

          <!-- Copertina Sinistra -->
          <a-box 
            position="-0.27 0 -0.05" 
            rotation="0 25 0" 
            width="0.5" height="0.7" depth="0.02" 
            src="#tex-copertina">
          </a-box>

          <!-- Copertina Destra -->
          <a-box 
            position="0.27 0 -0.05" 
            rotation="0 -25 0" 
            width="0.5" height="0.7" depth="0.02" 
            src="#tex-copertina">
          </a-box>

          <!-- Pagine Interne (Apertura a Ventaglio) -->
          <a-plane 
            position="-0.22 0.01 -0.02" 
            rotation="0 20 0" 
            width="0.48" height="0.68" 
            src="#tex-pagine" 
            side="double">
          </a-plane>

          <a-plane 
            position="-0.1 0.02 -0.01" 
            rotation="0 10 0" 
            width="0.48" height="0.68" 
            src="#tex-pagine" 
            side="double">
          </a-plane>

          <a-plane 
            position="0 0.03 0" 
            rotation="0 0 0" 
            width="0.48" height="0.68" 
            src="#tex-pagine" 
            side="double">
          </a-plane>

          <a-plane 
            position="0.1 0.02 -0.01" 
            rotation="0 -10 0" 
            width="0.48" height="0.68" 
            src="#tex-pagine" 
            side="double">
          </a-plane>

          <a-plane 
            position="0.22 0.01 -0.02" 
            rotation="0 -20 0" 
            width="0.48" height="0.68" 
            src="#tex-pagine" 
            side="double">
          </a-plane>

        </a-entity>

      </a-entity>
    </a-scene>
  </body>
</html>
