<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- File di configurazione -->
  <script src="./config.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 10;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Contenitore dell'opera riconosciuta -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");

      // Parametri dal config
      const pageAnimDur = config.pageOpenDuration || 1800;
      const pageAngle = config.pageOpenAngle || 140; // Portato a 140° per maggiore visibilità
      const pageEasing = config.pageEasing || "easeOutCubic";
      const baseLayersDelay = config.sequenceMode ? pageAnimDur : 0;

      // ==========================================
      // FASE 1: CREAZIONE PAGINE (ANCORATE A Z=0)
      // ==========================================
      const pagesConfig = [
        {
          id: "page-left",
          image: "./images/page_left.png",
          pivotPos: "-0.5 0 0.001",   // Z=0.001 per stare esattamente sul target di stampa
          planeOffset: "-0.5 0 0",
          toRot: `0 ${pageAngle} 0`
        },
        {
          id: "page-right",
          image: "./images/page_right.png",
          pivotPos: "0.5 0 0.001",    // Z=0.001 per stare esattamente sul target di stampa
          planeOffset: "0.5 0 0",
          toRot: `0 -${pageAngle} 0`
        },
        {
          id: "page-bottom",
          image: "./images/page_bottom.png",
          pivotPos: "0 -0.5 0.001",   // Z=0.001 per stare esattamente sul target di stampa
          planeOffset: "0 -0.5 0",
          toRot: `-${pageAngle} 0 0`
        }
      ];

      pagesConfig.forEach((p, index) => {
        // Pivot cerniera
        const pivot = document.createElement("a-entity");
        pivot.setAttribute("position", p.pivotPos);
        pivot.setAttribute("rotation", "0 0 0");

        // Piano grafico della pagina
        const pagePlane = document.createElement("a-plane");
        pagePlane.setAttribute("src", p.image);
        pagePlane.setAttribute("width", "1");
        pagePlane.setAttribute("height", "1");
        pagePlane.setAttribute("position", p.planeOffset);
        
        pagePlane.setAttribute("material", `
          transparent: true; 
          alphaTest: 0.5; 
          side: double;
          depthTest: true;
        `);
        
        // Assegniamo un render-order alto per evitare compenetrazioni
        pagePlane.setAttribute("render-order", 50 + index);

        // Animazione JS diretta sul pivot per forzare la rotazione da 0 al valore finale
        pivot.setAttribute("animation", {
          property: "rotation",
          from: "0 0 0",
          to: p.toRot,
          dur: pageAnimDur,
          easing: pageEasing,
          fill: "forwards"
        });

        pivot.appendChild(pagePlane);
        targetEntity.appendChild(pivot);
      });

      // ==========================================
      // FASE 2: ESTRAZIONE LAYER IN PROFONDITÀ (Z-AXIS)
      // ==========================================
      const stepDepth = config.layers > 1 ? (config.maxDepth / (config.layers - 1)) : 0;

      for (let i = 1; i <= config.layers; i++) {
        const layerNumber = String(i).padStart(2, '0');
        const imagePath = `./images/layer${layerNumber}.png`;
        const targetZ = (i - 1) * stepDepth;

        const plane = document.createElement("a-plane");
        plane.setAttribute("src", imagePath);
        plane.setAttribute("width", "1");
        plane.setAttribute("height", "1");
        plane.setAttribute("position", "0 0 0");
        plane.setAttribute("rotation", "0 0 0");
        
        plane.setAttribute("material", `
          transparent: true; 
          alphaTest: 0.5; 
          side: front;
          depthTest: true;
        `);
        
        plane.setAttribute("render-order", i);

        // Calcolo ritardo per far uscire i layer Z solo dopo le pagine
        const layerDelay = baseLayersDelay + ((i - 1) * (config.staggerDelay || 80));

        if (i > 1) {
          plane.setAttribute("animation", {
            property: "position",
            from: "0 0 0",
            to: `0 0 ${targetZ.toFixed(4)}`,
            dur: config.openDuration,
            delay: layerDelay,
            easing: config.easing,
            fill: "forwards"
          });
        }

        targetEntity.appendChild(plane);
      }
    });
  </script>

</body>
</html>
