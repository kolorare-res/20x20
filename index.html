<!DOCTYPE html>
<html lang="it">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Altrove</title>

    <!-- Librerie A-Frame e MindAR -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <script>
      // 1. Componente Fix Trasparenza PNG per WebGL
      AFRAME.registerComponent('fix-png-alpha', {
        init: function () {
          const el = this.el;

          el.addEventListener('componentinitialized', (evt) => {
            if (evt.detail.name === 'material') {
              const mat = el.components.material.material;
              if (mat) {
                mat.transparent = true;
                mat.alphaTest = 0.1;
                mat.needsUpdate = true;
              }
            }
          });

          el.addEventListener('materialtextureloaded', (e) => {
            const texture = e.detail.texture;
            if (texture) {
              texture.minFilter = THREE.LinearFilter;
              texture.generateMipmaps = false;
              texture.needsUpdate = true;
            }
          });
        }
      });

      // 2. Componente Smooth Tracker per stabilizzare l'ancoraggio AR
      AFRAME.registerComponent('smooth-tracker', {
        schema: { factor: { type: 'number', default: 0.15 } },
        init: function () {
          this.hasTarget = false;
          this.targetPos = new THREE.Vector3();
          this.targetQuat = new THREE.Quaternion();

          this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
          this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
        },
        tick: function () {
          if (!this.hasTarget) return;

          const obj = this.el.object3D;
          obj.position.lerp(this.targetPos, this.data.factor);
          obj.quaternion.slerp(this.targetQuat, this.data.factor);
        }
      });
    </script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <!-- CARICAMENTO ASSETS -->
      <a-assets>
        <!-- Immagine di fondo inferiore -->
        <img id="base-image" src="./assets/base.png" />

        <!-- I 11 layer verticali -->
        <img id="layer0" src="./assets/layer0.png" />
        <img id="layer1" src="./assets/layer1.png" />
        <img id="layer2" src="./assets/layer2.png" />
        <img id="layer3" src="./assets/layer3.png" />
        <img id="layer4" src="./assets/layer4.png" />
        <img id="layer5" src="./assets/layer5.png" />
        <img id="layer6" src="./assets/layer6.png" />
        <img id="layer7" src="./assets/layer7.png" />
        <img id="layer8" src="./assets/layer8.png" />
        <img id="layer9" src="./assets/layer9.png" />
        <img id="layer10" src="./assets/layer10.png" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- TARGET AR E ANCORAGGIO DIORAMA -->
      <a-entity mindar-image-target="targetIndex: 0" smooth-tracker="factor: 0.15">
        
        <!-- 
          BASE INFERIORE (PAVIMENTO DEL DIORAMA 20x20 cm):
          - Ruotata di -90deg sull'asse X per essere orizzontale
          - Abbassata di Y = -0.1 m (coincide con la base dei layer verticali)
          - Centrata a Z = 0.1 m per coprire l'intera profondità da 0 a 0.2 m
        -->
        <a-plane 
          src="#base-image" 
          position="0 -0.1 0.1" 
          rotation="-90 0 0" 
          width="0.2" 
          height="0.2" 
          fix-png-alpha>
        </a-plane>

        <!-- LAYER VERTICALI (Da Z = 0.002 m a Z = 0.20 m) -->
        <a-plane src="#layer0" position="0 0 0.002" width="0.2" height="0.2" fix-png-alpha></a-plane>
        <a-plane src="#layer1" position="0 0 0.02" width="0.2" height="0.2" fix-png-alpha></a-plane>
        <a-plane src="#layer2" position="0 0 0.04" width="0.2" height="0.2" fix-png-alpha></a-plane>
        <a-plane src="#layer3" position="0 0 0.06" width="0.2" height="0.2" fix-png-alpha></a-plane>
        <a-plane src="#layer4" position="0 0 0.08" width="0.2" height="0.2" fix-png-alpha></a-plane>
        <a-plane src="#layer5" position="0 0 0.10" width="0.2" height="0.2" fix-png-alpha></a-plane>
        <a-plane src="#layer6" position="0 0 0.12" width="0.2" height="0.2" fix-png-alpha></a-plane>
        <a-plane src="#layer7" position="0 0 0.14" width="0.2" height="0.2" fix-png-alpha></a-plane>
        <a-plane src="#layer8" position="0 0 0.16" width="0.2" height="0.2" fix-png-alpha></a-plane>
        <a-plane src="#layer9" position="0 0 0.18" width="0.2" height="0.2" fix-png-alpha></a-plane>
        <a-plane src="#layer10" position="0 0 0.20" width="0.2" height="0.2" fix-png-alpha></a-plane>

      </a-entity>
    </a-scene>
  </body>
</html>
