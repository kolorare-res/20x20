<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove</title>

  <!-- Librerie A-Frame 1.4.2 e MindAR 1.2.5 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- File di configurazione -->
  <script src="./config.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 10;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Contenitore dell'opera riconosciuta: Altrove -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");

      const totalLayers = config.layers || 6;
      const maxDepth = config.maxDepth || 0.6;
      const openDur = config.openDuration || 1500;
      const stagger = config.staggerDelay || 120;
      const easingType = config.easing || "easeOutCubic";

      const stepDepth = totalLayers > 1 ? (maxDepth / (totalLayers - 1)) : 0;
      const boxCenterZ = maxDepth / 2;

      // ==========================================
      // 1. STRUTTURA SCATOLA 3D NATIVA (5 FACCE)
      // ==========================================
      const boxGroup = document.createElement("a-entity");
      boxGroup.setAttribute("id", "diorama-box");

      // Stile comune per le pareti interne della scatola
      const wallMaterial = "color: #1a1a1a; roughness: 0.8; side: double;";

      // PARETE DI FONDO (Z = 0)
      const wallBack = document.createElement("a-plane");
      wallBack.setAttribute("width", "1");
      wallBack.setAttribute("height", "1");
      wallBack.setAttribute("position", "0 0 -0.005");
      wallBack.setAttribute("material", wallMaterial);
      boxGroup.appendChild(wallBack);

      // PARETE SINISTRA
      const wallLeft = document.createElement("a-plane");
      wallLeft.setAttribute("width", maxDepth);
      wallLeft.setAttribute("height", "1");
      wallLeft.setAttribute("position", `-0.5 0 ${boxCenterZ}`);
      wallLeft.setAttribute("rotation", "0 90 0");
      wallLeft.setAttribute("material", wallMaterial);
      boxGroup.appendChild(wallLeft);

      // PARETE DESTRA
      const wallRight = document.createElement("a-plane");
      wallRight.setAttribute("width", maxDepth);
      wallRight.setAttribute("height", "1");
      wallRight.setAttribute("position", `0.5 0 ${boxCenterZ}`);
      wallRight.setAttribute("rotation", "0 -90 0");
      wallRight.setAttribute("material", wallMaterial);
      boxGroup.appendChild(wallRight);

      // PARETE SUPERIORE (TETTO)
      const wallTop = document.createElement("a-plane");
      wallTop.setAttribute("width", "1");
      wallTop.setAttribute("height", maxDepth);
      wallTop.setAttribute("position", `0 0.5 ${boxCenterZ}`);
      wallTop.setAttribute("rotation", "90 0 0");
      wallTop.setAttribute("material", wallMaterial);
      boxGroup.appendChild(wallTop);

      // PARETE INFERIORE (BASE)
      const wallBottom = document.createElement("a-plane");
      wallBottom.setAttribute("width", "1");
      wallBottom.setAttribute("height", maxDepth);
      wallBottom.setAttribute("position", `0 -0.5 ${boxCenterZ}`);
      wallBottom.setAttribute("rotation", "-90 0 0");
      wallBottom.setAttribute("material", wallMaterial);
      boxGroup.appendChild(wallBottom);

      targetEntity.appendChild(boxGroup);

      // ==========================================
      // 2. LAYER Z ALL'INTERNO DELLA SCATOLA
      // ==========================================
      for (let i = 1; i <= totalLayers; i++) {
        const layerNumber = String(i).padStart(2, '0');
        const plane = document.createElement("a-plane");
        
        plane.setAttribute("src", `./images/layer${layerNumber}.png`);
        plane.setAttribute("width", "1");
        plane.setAttribute("height", "1");
        plane.setAttribute("position", "0 0 0");
        plane.setAttribute("scale", "1 1 1");
        
        plane.setAttribute("material", `
          transparent: true; 
          alphaTest: 0.5; 
          side: front;
          depthTest: true;
        `);
        
        plane.setAttribute("render-order", 10 + i);

        if (i > 1) {
          const targetZ = (i - 1) * stepDepth;
          const delayTime = (i - 1) * stagger;
          const scaleFactor = 1 + ((i - 1) / (totalLayers - 1)) * 0.28;

          plane.setAttribute("animation__pos", `
            property: position;
            from: 0 0 0;
            to: 0 0 ${targetZ.toFixed(4)};
            dur: ${openDur};
            delay: ${delayTime};
            easing: ${easingType};
            fill: forwards;
          `);

          plane.setAttribute("animation__scale", `
            property: scale;
            from: 1 1 1;
            to: ${scaleFactor} ${scaleFactor} 1;
            dur: ${openDur};
            delay: ${delayTime};
            easing: ${easingType};
            fill: forwards;
          `);
        }

        targetEntity.appendChild(plane);
      }
    });
  </script>

</body>
</html>
