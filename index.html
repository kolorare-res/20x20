<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // Componente Smooth Tracker
    AFRAME.registerComponent('smooth-tracker', {
      schema: { factor: { type: 'number', default: 0.35 } },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;
        const object3D = this.el.object3D;
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }
        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });

    // Fix Trasparenza PNG
    AFRAME.registerComponent('fix-png-alpha', {
      init: function () {
        this.el.addEventListener('materialtextureloaded', (e) => {
          const texture = e.detail.texture;
          if (texture) {
            texture.minFilter = THREE.NearestFilter;
            texture.generateMipmaps = false;
            texture.needsUpdate = true;
          }
        });
      }
    });

    // Componente Particelle Cadenti
    AFRAME.registerComponent('falling-particles', {
      schema: {
        count: { type: 'int', default: 22 },
        textures: { type: 'array', default: [] },
        xMin: { type: 'number', default: -0.480 },
        xMax: { type: 'number', default: -0.100 },
        yMin: { type: 'number', default: -0.325 },
        yMax: { type: 'number', default: 0.150 },
        yKill: { type: 'number', default: -0.600 },
        zMin: { type: 'number', default: 0.700 },
        zMax: { type: 'number', default: 0.850 },
        baseSizeMin: { type: 'number', default: 0.010 },
        baseSizeMax: { type: 'number', default: 0.030 },
        fallSpeedMin: { type: 'number', default: 0.0005 },
        fallSpeedMax: { type: 'number', default: 0.0009 },
        swayAmp: { type: 'number', default: 0.025 },
        enable3DRotation: { type: 'boolean', default: true }
      },

      init: function () {
        this.particles = [];
        const overlayMat = "transparent: true; alphaTest: 0.1; depthWrite: false; depthTest: true;";

        for (let i = 0; i < this.data.count; i++) {
          const pEl = document.createElement('a-plane');
          const randTex = this.data.textures[Math.floor(Math.random() * this.data.textures.length)];
          const size = this.data.baseSizeMin + (Math.random() * (this.data.baseSizeMax - this.data.baseSizeMin));
          
          pEl.setAttribute('width', size);
          pEl.setAttribute('height', size);
          pEl.setAttribute('fix-png-alpha', '');
          pEl.setAttribute('material', `src: url(${randTex}); ${overlayMat} side: double;`);
          pEl.setAttribute('render-order', 80);

          this.el.appendChild(pEl);

          const pData = {
            el: pEl,
            xInit: this.randomRange(this.data.xMin, this.data.xMax),
            x: 0,
            y: this.randomRange(this.data.yMin, this.data.yMax),
            z: this.randomRange(this.data.zMin, this.data.zMax),
            fallSpeed: this.randomRange(this.data.fallSpeedMin, this.data.fallSpeedMax),
            swayAmp: this.data.swayAmp * (0.8 + Math.random() * 0.4),
            swayFreq: 0.0018 + (Math.random() * 0.0015),
            rotSpeedZ: (Math.random() - 0.5) * 1.8,
            rotSpeedX: this.data.enable3DRotation ? (Math.random() - 0.5) * 1.2 : 0,
            rotZ: Math.random() * 360,
            rotX: this.data.enable3DRotation ? Math.random() * 360 : 0,
            timeOffset: Math.random() * 2000
          };

          pData.x = pData.xInit;
          this.particles.push(pData);
        }
      },

      randomRange: function (min, max) {
        return min + Math.random() * (max - min);
      },

      resetParticle: function (p) {
        p.xInit = this.randomRange(this.data.xMin, this.data.xMax);
        p.x = p.xInit;
        p.y = this.data.yMax;
        p.z = this.randomRange(this.data.zMin, this.data.zMax);
        p.fallSpeed = this.randomRange(this.data.fallSpeedMin, this.data.fallSpeedMax);
        p.rotZ = Math.random() * 360;
      },

      tick: function (time, timeDelta) {
        if (!timeDelta) return;

        this.particles.forEach(p => {
          p.y -= p.fallSpeed * (timeDelta / 16.6);
          const sway = Math.sin((time + p.timeOffset) * p.swayFreq) * p.swayAmp;
          p.x = p.xInit + sway;

          p.rotZ += p.rotSpeedZ;
          if (this.data.enable3DRotation) {
            p.rotX += p.rotSpeedX;
          }

          p.el.object3D.position.set(p.x, p.y, p.z);
          p.el.object3D.rotation.z = THREE.MathUtils.degToRad(p.rotZ);
          if (this.data.enable3DRotation) {
            p.el.object3D.rotation.x = THREE.MathUtils.degToRad(p.rotX);
          }

          if (p.y < this.data.yKill) {
            this.resetParticle(p);
          }
        });
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
    .a-enter-vr-button { display: none !important; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights; antialias: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0" smooth-tracker="factor: 0.35"></a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");

      const cleanAlphaMat = "transparent: true; alphaTest: 0.5; depthWrite: true; depthTest: true;";

      const planeWidth = 1.0;    
      const planeHeight = 1.0;   

      // ==========================================
      // CONFIGURAZIONE LIVELLI E PROFONDITÀ Z
      // ==========================================
      const zBack = 0.0075;
      const zFront = 0.9000;
      const bottomLengthExact = zFront - zBack; // 0.8925m
      const gridUnit = bottomLengthExact / 20;  // Unità riga di griglia = 0.044625m

      const layersConfig = [
        { src: "./images/layer01.png", z: 0.0075 },
        { src: "./images/layer02.png", z: 0.0150 },
        { src: "./images/layer03.png", z: 0.2000 },
        { src: "./images/layer04.png", z: 0.2800 },
        { src: "./images/layer05.png", z: 0.3500 },
        { src: "./images/layer06.png", z: 0.4500 },
        { src: "./images/layer07.png", z: zFront - (5.0 * gridUnit), bottomTexture: "./images/layer07_bottom.png" }, // Verde: Z = 0.6769
        { src: "./images/layer08.png", z: zFront - (3.0 * gridUnit) },                                             // Magenta: Z = 0.7661
        { src: "./images/layer09.png", z: zFront - (2.5 * gridUnit) }                                              // Blu: Z = 0.7884 (sulla mediana dell'azzurro)
      ];

      const bottomTexture = "./images/box_bottom.png"; 

      // ==========================================
      // PIANO BASE GENERALE
      // ==========================================
      const bottomCenterZExact = zBack + (bottomLengthExact / 2); 
      const bottomYPos = -(planeHeight / 2);

      const bottomPlane = document.createElement("a-plane");
      bottomPlane.setAttribute("width", planeWidth);
      bottomPlane.setAttribute("height", bottomLengthExact);
      bottomPlane.setAttribute("position", `0 ${bottomYPos.toFixed(4)} ${bottomCenterZExact.toFixed(4)}`);
      bottomPlane.setAttribute("rotation", "-90 0 0");
      bottomPlane.setAttribute("fix-png-alpha", "");
      bottomPlane.setAttribute("material", `src: url(${bottomTexture}); ${cleanAlphaMat} side: double;`);
      bottomPlane.setAttribute("render-order", 1);
      targetEntity.appendChild(bottomPlane);

      // ==========================================
      // GENERAZIONE PIANI ORIZZONTALI EXTRA
      // ==========================================
      layersConfig.forEach((layer, idx) => {
        if (layer.bottomTexture) {
          const nextLayer = layersConfig[idx + 1];
          const stripDepth = nextLayer ? (nextLayer.z - layer.z) : 0.1;
          const stripCenterZ = layer.z + (stripDepth / 2);
          const yPos = bottomYPos + 0.001 + (idx * 0.0005); 

          const bPlane = document.createElement("a-plane");
          bPlane.setAttribute("width", planeWidth);
          bPlane.setAttribute("height", stripDepth);
          bPlane.setAttribute("position", `0 ${yPos.toFixed(4)} ${stripCenterZ.toFixed(4)}`);
          bPlane.setAttribute("rotation", "-90 0 0");
          bPlane.setAttribute("fix-png-alpha", "");
          bPlane.setAttribute("material", `src: url(${layer.bottomTexture}); ${cleanAlphaMat} side: double;`);
          bPlane.setAttribute("render-order", 5 + idx);
          targetEntity.appendChild(bPlane);
        }
      });

 // ==========================================
// LAYER 09 (BOTTOM, MIDDLE, TOP)
// ==========================================
const gridColumns = 20;
const gridRows = 20;

// Coordinate base dell'area azzurra 5x5
const l09BottomWidthBase = (5 / gridColumns) * planeWidth;  // 0.2500 m (25 cm)
const l09BottomDepthBase = (5 / gridRows) * bottomLengthExact; // 0.2231 m 

// Mediana (centro esatto in X e Z su cui centrare gli ingrandimenti)
const l09CenterX = - (planeWidth / 2) + (l09BottomWidthBase / 2); // X = -0.3750
const l09CenterZ = zFront - (l09BottomDepthBase / 2);              // Z = 0.7884

// ------------------------------------------
// 1. LAYER 09 BOTTOM (Base - 25cm originali)
// ------------------------------------------
const l09BottomY = bottomYPos + 0.002;

const l09BottomPlane = document.createElement("a-plane");
l09BottomPlane.setAttribute("width", l09BottomWidthBase.toFixed(4));
l09BottomPlane.setAttribute("height", l09BottomDepthBase.toFixed(4));
l09BottomPlane.setAttribute("position", `${l09CenterX.toFixed(4)} ${l09BottomY.toFixed(4)} ${l09CenterZ.toFixed(4)}`);
l09BottomPlane.setAttribute("rotation", "-90 0 0");
l09BottomPlane.setAttribute("fix-png-alpha", "");
l09BottomPlane.setAttribute("material", `src: url(./images/layer09_bottom.png); ${cleanAlphaMat} side: double;`);
l09BottomPlane.setAttribute("render-order", 20);
targetEntity.appendChild(l09BottomPlane);

// ------------------------------------------
// 2. LAYER 09 MIDDLE (Dimensione 6 cm reale = 0.06m)
// ------------------------------------------
const l09MiddleSize = 0.06; // 6 cm in metri
const l09MiddleY = 0.85;    // Y = 0.85 come richiesto

const l09MiddlePlane = document.createElement("a-plane");
l09MiddlePlane.setAttribute("width", l09MiddleSize);
l09MiddlePlane.setAttribute("height", l09MiddleSize);
l09MiddlePlane.setAttribute("position", `${l09CenterX.toFixed(4)} ${l09MiddleY.toFixed(4)} ${l09CenterZ.toFixed(4)}`);
l09MiddlePlane.setAttribute("rotation", "-90 0 0");
l09MiddlePlane.setAttribute("fix-png-alpha", "");
l09MiddlePlane.setAttribute("material", `src: url(./images/layer09_middle.png); ${cleanAlphaMat} side: double;`);
l09MiddlePlane.setAttribute("render-order", 21);
targetEntity.appendChild(l09MiddlePlane);

// ------------------------------------------
// 3. LAYER 09 TOP (Dimensione 7.5 cm reale = 0.075m)
// ------------------------------------------
const l09TopSize = 0.075; // 7.5 cm in metri
const l09TopY = 0;        // Y = 0 come richiesto

const l09TopPlane = document.createElement("a-plane");
l09TopPlane.setAttribute("width", l09TopSize);
l09TopPlane.setAttribute("height", l09TopSize);
l09TopPlane.setAttribute("position", `${l09CenterX.toFixed(4)} ${l09TopY.toFixed(4)} ${l09CenterZ.toFixed(4)}`);
l09TopPlane.setAttribute("rotation", "-90 0 0");
l09TopPlane.setAttribute("fix-png-alpha", "");
l09TopPlane.setAttribute("material", `src: url(./images/layer09_top.png); ${cleanAlphaMat} side: double;`);
l09TopPlane.setAttribute("render-order", 22);
targetEntity.appendChild(l09TopPlane);


      
      // ==========================================
      // GENERAZIONE LAYER DIORAMA VERTICALI
      // ==========================================
      layersConfig.forEach((layer, idx) => {
        const element = document.createElement("a-plane");
        element.setAttribute("width", planeWidth);
        element.setAttribute("height", planeHeight);
        element.setAttribute("position", `0 0 ${layer.z.toFixed(4)}`);
        element.setAttribute("fix-png-alpha", "");
        element.setAttribute("material", `src: url(${layer.src}); ${cleanAlphaMat} side: double;`);
        element.setAttribute("render-order", 40 + (idx * 2));
        targetEntity.appendChild(element);
      });

      // ==========================================
      // PARTICELLE
      // ==========================================
      const particleTextures = [];
      for (let i = 11; i <= 28; i++) {
        particleTextures.push(`./images/layer05-${i}.png`);
      }

      const particlesContainer = document.createElement("a-entity");
      particlesContainer.setAttribute("falling-particles", {
        count: 22,
        textures: particleTextures,
        xMin: -0.480,
        xMax: -0.100,
        yMin: -0.325,
        yMax: 0.150,
        yKill: -0.600,
        zMin: 0.700,
        zMax: 0.850,
        baseSizeMin: 0.010,
        baseSizeMax: 0.030,
        fallSpeedMin: 0.0005,
        fallSpeedMax: 0.0009,
        swayAmp: 0.025,
        enable3DRotation: true
      });
      targetEntity.appendChild(particlesContainer);

    });
  </script>
</body>
</html>
