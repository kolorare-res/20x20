<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove</title>

  <!-- Librerie A-Frame 1.4.2 e MindAR 1.2.5 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- File di configurazione -->
  <script src="./config.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 10;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Contenitore dell'opera riconosciuta: Altrove -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");

      // Parametri di profondità e ritardo dal config
      const totalLayers = config.layers || 6;
      const maxDepth = config.maxDepth || 0.5;
      const openDur = config.openDuration || 1500;
      const stagger = config.staggerDelay || 120;
      const easingType = config.easing || "easeOutCubic";

      const stepDepth = totalLayers > 1 ? (maxDepth / (totalLayers - 1)) : 0;

      // ==========================================
      // CREAZIONE E ANIMAZIONE A CASCATA DEI LAYER Z
      // ==========================================
      for (let i = 1; i <= totalLayers; i++) {
        const layerNumber = String(i).padStart(2, '0');
        const plane = document.createElement("a-plane");
        
        plane.setAttribute("src", `./images/layer${layerNumber}.png`);
        plane.setAttribute("width", "1");
        plane.setAttribute("height", "1");
        plane.setAttribute("position", "0 0 0"); // Tutti partono dal piano della stampa (Z=0)
        plane.setAttribute("rotation", "0 0 0");
        
        plane.setAttribute("material", `
          transparent: true; 
          alphaTest: 0.5; 
          side: front;
          depthTest: true;
        `);
        
        // Render order progressivo per evitare flickering trasparente
        plane.setAttribute("render-order", i);

        // Il primo layer (layer01) rimane piatto al centro della stampa, 
        // i successivi si estraggono in profondità
        if (i > 1) {
          const targetZ = (i - 1) * stepDepth;
          const delayTime = (i - 1) * stagger;

          plane.setAttribute("animation", `
            property: position;
            from: 0 0 0;
            to: 0 0 ${targetZ.toFixed(4)};
            dur: ${openDur};
            delay: ${delayTime};
            easing: ${easingType};
            fill: forwards;
          `);
        }

        targetEntity.appendChild(plane);
      }
    });
  </script>

</body>
</html>
