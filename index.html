<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // Componente Smooth Tracker
    AFRAME.registerComponent('smooth-tracker', {
      schema: { factor: { type: 'number', default: 0.35 } },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;
        const object3D = this.el.object3D;
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }
        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });
     // MOVIMENTO OCCHI MOSTRO
// 1. IRIDE: Movimento biologico iper-scattante con bilanciamento verso l'utente
AFRAME.registerComponent('eye-movement', {
  schema: {
    rangeZ: { type: 'number', default: 0.0065 },    // Escursione di 1.3 cm totali (±0.65 cm dal centro)
    minPause: { type: 'number', default: 400 },      // Pausa minima tra le occhiate (0.4s)
    maxPause: { type: 'number', default: 1800 },     // Pausa massima tra le occhiate (1.8s)
    moveDuration: { type: 'number', default: 90 },    // Scatto ultra-rapido (90 ms)
    userBias: { type: 'number', default: 0.6 }       // 60% di priorità a guardare in avanti (spettatore)
  },

  init: function () {
    this.baseZ = this.el.object3D.position.z;
    this.currentZ = this.baseZ;
    this.targetZ = this.baseZ;
    
    this.isMoving = false;
    this.moveTimer = 0;
    this.pauseTimer = 0;
    this.pauseDuration = this.getRandomPause();
  },

  getRandomPause: function () {
    return Math.random() * (this.data.maxPause - this.data.minPause) + this.data.minPause;
  },

  getRandomTargetZ: function () {
    // Bilancia la direzione per spingere l'iride verso lo spettatore (Z > 0.35)
    const direction = Math.random() < this.data.userBias ? 1 : -1;
    const intensity = Math.random() * this.data.rangeZ;
    return this.baseZ + (direction * intensity);
  },

  tick: function (t, dt) {
    if (!dt) return;

    if (this.isMoving) {
      this.moveTimer += dt;
      const progress = Math.min(this.moveTimer / this.data.moveDuration, 1);
      
      // Funzione di easing "Expo Out" per arresto immediato
      const easeProgress = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
      
      const newZ = this.currentZ + (this.targetZ - this.currentZ) * easeProgress;
      this.el.object3D.position.z = newZ;

      if (progress >= 1) {
        this.isMoving = false;
        this.currentZ = this.targetZ;
        this.pauseTimer = 0;
        this.pauseDuration = this.getRandomPause();
      }
    } else {
      this.pauseTimer += dt;
      
      if (this.pauseTimer >= this.pauseDuration) {
        this.targetZ = this.getRandomTargetZ();
        this.isMoving = true;
        this.moveTimer = 0;
      }
    }
  }
});

    
// 2. PALPEBRA: Movimento di battito / scorrimento
// 2. PALPEBRA (Immagine sorgente CHIUSA, occhio prevalentemente APERTO)
AFRAME.registerComponent('eyelid-blink', {
  schema: {
    closeDuration: { type: 'number', default: 150 },  // Scatto di chiusura rapido (ms)
    holdClosed: { type: 'number', default: 200 },     // Tempo ad occhio chiuso durante il battito (ms)
    openDuration: { type: 'number', default: 250 },   // Riapertura rapida (ms)
    minPause: { type: 'number', default: 4000 },      // Tempo minimo ad OCCHIO APERTO (4s)
    maxPause: { type: 'number', default: 9000 },      // Tempo massimo ad OCCHIO APERTO (9s)
    blinkDistanceX: { type: 'number', default: 0.15 } // Traslazione per scoprire l'occhio (m)
  },

  init: function () {
    this.baseX = this.el.object3D.position.x;
    // Imposta la posizione iniziale ad OCCHIO APERTO (traslato su X)
    this.el.object3D.position.x = this.baseX + this.data.blinkDistanceX;
    
    this.state = 'OPEN'; // Stati: OPEN, CLOSING, HOLD_CLOSED, OPENING
    this.timer = 0;
    this.pauseDuration = this.getRandomPause();
  },

  getRandomPause: function () {
    return Math.random() * (this.data.maxPause - this.data.minPause) + this.data.minPause;
  },

  tick: function (t, dt) {
    if (!dt) return;

    switch (this.state) {
      case 'OPEN':
        // L'occhio rimane APERTO (traslato) per la maggior parte del tempo (4-9s)
        this.timer += dt;
        if (this.timer >= this.pauseDuration) {
          this.state = 'CLOSING';
          this.timer = 0;
        }
        break;

      case 'CLOSING':
        // La palpebra torna alla posizione base (copre l'iride per chiudere)
        this.timer += dt;
        const closeProgress = Math.min(this.timer / this.data.closeDuration, 1);
        const easeClose = 0.5 - Math.cos(closeProgress * Math.PI) / 2;
        
        this.el.object3D.position.x = (this.baseX + this.data.blinkDistanceX) - (this.data.blinkDistanceX * easeClose);

        if (closeProgress >= 1) {
          this.state = 'HOLD_CLOSED';
          this.timer = 0;
        }
        break;

      case 'HOLD_CLOSED':
        // Breve pausa a palpebra chiusa
        this.timer += dt;
        if (this.timer >= this.data.holdClosed) {
          this.state = 'OPENING';
          this.timer = 0;
        }
        break;

      case 'OPENING':
        // Si sposta di nuovo via per riaprire l'occhio
        this.timer += dt;
        const openProgress = Math.min(this.timer / this.data.openDuration, 1);
        const easeOpen = 0.5 - Math.cos(openProgress * Math.PI) / 2;

        this.el.object3D.position.x = this.baseX + (this.data.blinkDistanceX * easeOpen);

        if (openProgress >= 1) {
          this.el.object3D.position.x = this.baseX + this.data.blinkDistanceX;
          this.state = 'OPEN';
          this.timer = 0;
          this.pauseDuration = this.getRandomPause();
        }
        break;
    }
  }
});
    // FINE MOVIMENTO OCCHI MOSTRO

// 3. MONGOLFIERA (Oscillazione verticale morbida)
// MONGOLFIERA (Fluttuazione impercettibile e maestosa)
AFRAME.registerComponent('balloon-float', {
  schema: {
    minY: { type: 'number', default: 0.0 },       // Quota Y minima (0 m)
    maxY: { type: 'number', default: 0.16 },      // Quota Y massima (16 cm)
    rangeX: { type: 'number', default: 0.015 },   // Micro-spostamento laterale su X (±1.5 cm)
    rangeRotZ: { type: 'number', default: 0.8 },  // Inclinazione quasi impercettibile (±0.8°)
    speedY: { type: 'number', default: 0.00025 }, // Salita/discesa ultra-lenta (~25 secondi per ciclo)
    speedX: { type: 'number', default: 0.00018 }  // Dondolio armonico su tempi lunghi
  },

  init: function () {
    this.baseX = this.el.object3D.position.x;
    this.timeY = 0;
    this.timeX = 0;
  },

  tick: function (t, dt) {
    if (!dt) return;

    this.timeY += dt * this.data.speedY;
    this.timeX += dt * this.data.speedX;

    // 1. Salita e discesa verticale da 0 a 0.16m
    const factorY = (Math.sin(this.timeY) + 1) / 2;
    const currentY = this.data.minY + factorY * (this.data.maxY - this.data.minY);

    // 2. Fluttuazione orizzontale impercettibile su X
    const offsetX = Math.sin(this.timeX) * this.data.rangeX;

    // 3. Inclinazione minima e morbida su Z
    const tiltZ = Math.cos(this.timeX) * this.data.rangeRotZ;

    // Applica le trasformazioni
    this.el.object3D.position.y = currentY;
    this.el.object3D.position.x = this.baseX + offsetX;
    this.el.object3D.rotation.z = THREE.MathUtils.degToRad(tiltZ);
  }
});
    
    // FINE MONGOLFIERA 

// 4. BARCA: Beccheggio e galleggiamento sull'acqua
AFRAME.registerComponent('boat-pitch', {
  schema: {
    pitchDeg: { type: 'number', default: 3.5 },   // Inclinazione massima di beccheggio (±3.5°)
    bobY: { type: 'number', default: 0.008 },      // Galleggiamento verticale su Y (±8 mm)
    speed: { type: 'number', default: 0.002 }      // Velocità delle onde
  },

  init: function () {
    this.baseY = this.el.object3D.position.y;
    this.time = 0;
  },

  tick: function (t, dt) {
    if (!dt) return;

    this.time += dt * this.data.speed;

    // 1. Oscillazione di galleggiamento verticale (Y)
    const offsetY = Math.sin(this.time) * this.data.bobY;
    this.el.object3D.position.y = this.baseY + offsetY;

    // 2. Beccheggio (Inclinazione su Z, sfasata di 90° per seguire la cresta dell'onda)
    const pitchAngle = Math.cos(this.time) * this.data.pitchDeg;
    this.el.object3D.rotation.z = THREE.MathUtils.degToRad(pitchAngle);
  }
});

// FINE BARCA 

// 5. FARFALLA 3D: Battito ali incernierato + Traiettoria organica
AFRAME.registerComponent('butterfly-3d-flight', {
  schema: {
    radiusX: { type: 'number', default: 0.12 },     // Raggio di volo attorno ai fiori
    radiusY: { type: 'number', default: 0.08 },
    flapAngle: { type: 'number', default: 50 },
    flapSpeed: { type: 'number', default: 0.02 },
    flightSpeed: { type: 'number', default: 0.001 }
  },

  init: function () {
    // Origine ancorata sulla zona fiori
    this.centerX = this.el.object3D.position.x;
    this.centerY = this.el.object3D.position.y;
    this.centerZ = this.el.object3D.position.z;

    this.leftWing = this.el.querySelector('.wing-left');
    this.rightWing = this.el.querySelector('.wing-right');

    this.timeFlight = 0;
    this.timeFlap = 0;
    this.prevPos = new THREE.Vector3();
  },

  tick: function (t, dt) {
    if (!dt) return;

    this.timeFlight += dt * this.data.flightSpeed;
    this.timeFlap += dt * this.data.flapSpeed;

    // 1. Traiettoria sfasata attorno ai fiori + escursione su Z verso l'utente
    const offsetX = Math.sin(this.timeFlight) * this.data.radiusX;
    const offsetY = Math.sin(this.timeFlight * 2) * this.data.radiusY;
    const offsetZ = Math.cos(this.timeFlight * 1.5) * 0.06; // Esce fino a Z = 1.11

    const currentPos = new THREE.Vector3(
      this.centerX + offsetX,
      this.centerY + offsetY,
      this.centerZ + offsetZ
    );

    // 2. Orientamento tridimensionale del corpo lungo la direzione di volo
    const dir = new THREE.Vector3().subVectors(currentPos, this.el.object3D.position);
    if (dir.lengthSq() > 0.00001) {
      // Orienta la testa verso la direzione di spostamento
      const angleZ = Math.atan2(dir.y, dir.x) - Math.PI / 2;
      this.el.object3D.rotation.z = angleZ;
      // Inclinazione dinamica su X basata sulla salita/discesa
      this.el.object3D.rotation.x = dir.z * 5;
    }

    this.el.object3D.position.copy(currentPos);

    // 3. Battito d'ali 3D
    if (this.leftWing && this.rightWing) {
      const flapRad = THREE.MathUtils.degToRad(Math.sin(this.timeFlap) * this.data.flapAngle);
      this.leftWing.object3D.rotation.y = flapRad;
      this.rightWing.object3D.rotation.y = -flapRad;
    }
  }
});
    
// FINE FARFALLA
    
  </script>
