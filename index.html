<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // Componente Smooth Tracker
    AFRAME.registerComponent('smooth-tracker', {
      schema: { factor: { type: 'number', default: 0.35 } },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;
        const object3D = this.el.object3D;
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }
        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* Rimuove lo spinner e la schermata azzurra di caricamento di MindAR */
    .mindar-ui-loading, 
    div[class*="mindar-ui-loading"] {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* Forza la trasparenza su tutti gli elementi overlay e contenitori MindAR per evitare il fondo azzurro */
    .mindar-ui-overlay, 
    div[class*="mindar-ui"] {
      background: transparent !important;
      background-color: transparent !important;
    }
  </style>
</head>

<body>
  <!-- uiLoading: no disabilita il caricamento nativo HTML di MindAR -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5; uiLoading: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true; antialias: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <!-- CARICAMENTO ASSETS -->
    <a-assets>
      <img id="base-image" src="./assets/base.png" crossorigin="anonymous" />
      <img id="layer0" src="./assets/layer0.png" crossorigin="anonymous" />
      <img id="layer1" src="./assets/layer1.png" crossorigin="anonymous" />
      <img id="layer1-floor" src="./assets/layer1-floor.png" crossorigin="anonymous" />
      <img id="layer1-mongolfiera" src="./assets/layer1-mongolfiera.png" crossorigin="anonymous" />
      <img id="layer2" src="./assets/layer2.png" crossorigin="anonymous" />
      <img id="layer3" src="./assets/layer3.png" crossorigin="anonymous" />
      <img id="layer4" src="./assets/layer4.png" crossorigin="anonymous" />
      <img id="layer5" src="./assets/layer5.png" crossorigin="anonymous" />
      <img id="layer6" src="./assets/layer6.png" crossorigin="anonymous" />
      <img id="layer7" src="./assets/layer7.png" crossorigin="anonymous" />
      <img id="layer8" src="./assets/layer8.png" crossorigin="anonymous" />
      <img id="layer8-floor" src="./assets/layer8-floor.png" crossorigin="anonymous" />
      <img id="layer9" src="./assets/layer9.png" crossorigin="anonymous" />
      <img id="layer9-barca" src="./assets/layer9-barca.png" crossorigin="anonymous" />
      <img id="layer9-over" src="./assets/layer9-over.png" crossorigin="anonymous" />
      <img id="layer9-floor" src="./assets/layer9-floor.png" crossorigin="anonymous" />
      <img id="layer9-middle" src="./assets/layer9-middle.png" crossorigin="anonymous" />
      <img id="layer9-top" src="./assets/layer9-top.png" crossorigin="anonymous" />
      <img id="layer10" src="./assets/layer10.png" crossorigin="anonymous" />
      <img id="layer10-floor" src="./assets/layer10-floor.png" crossorigin="anonymous" />
      <img id="layer10-back" src="./assets/layer10-back.png" crossorigin="anonymous" />
      <img id="layer-mostro" src="./assets/layer-mostro.png" crossorigin="anonymous" />


    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- TARGET ANCORAGGIO -->
    <a-entity mindar-image-target="targetIndex: 0" smooth-tracker="factor: 0.35">
      
      <!-- BASE INFERIORE (PAVIMENTO) -->
      <a-plane 
        src="#base-image" 
        position="0 -0.5 0.5" 
        rotation="-90 0 0" 
        width="1" 
        height="1" 
        material="transparent: true; alphaTest: 0.1; side: double;">
      </a-plane>

      <!-- 11 LAYER VERTICALI E MENSELE -->
      <a-plane src="#layer0" position="0 0 0.01" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
     
      <a-plane src="#layer1-mongolfiera" position="0 0 0.03" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>

      <a-plane src="#layer1" position="0 0 0.05" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
      <a-plane 
  src="#layer1-floor" 
  position="0 -0.499 0.075" 
  rotation="-90 0 0" 
  width="1" 
  height="0.05" 
  material="transparent: true; alphaTest: 0.1; side: double;">
</a-plane>
      
      <a-plane src="#layer2" position="0 0 0.10" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
      <a-plane src="#layer3" position="0 0 0.20" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
      <a-plane src="#layer4" position="0 0 0.30" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
      <a-plane src="#layer5" position="0 0 0.45" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
      <a-plane src="#layer6" position="0 0 0.50" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
      <a-plane src="#layer7" position="0 0 0.70" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
      
     <!-- LAYER 8 -->
<a-plane src="#layer8" position="0 0 0.620" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>

<a-plane 
  src="#layer8-floor" 
  position="0 -0.499 0.720" 
  rotation="-90 0 0" 
  width="1" 
  height="0.20" 
  material="transparent: true; alphaTest: 0.1; side: double;">
</a-plane>

<!-- LAYER 9 -->
<a-plane src="#layer9" position="0 0 0.845" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
<a-plane src="#layer9-over" position="0 0 0.895" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>

<a-plane 
  src="#layer9-top" 
  position="0 0.094 0.845" 
  rotation="-90 0 0" 
  width="1" 
  height="0.45" 
  material="transparent: true; alphaTest: 0.1; side: double;">
</a-plane>

<a-plane 
  src="#layer9-middle" 
  position="0 -0.11 0.845" 
  rotation="-90 0 0" 
  width="1" 
  height="0.35" 
  material="transparent: true; alphaTest: 0.1; side: double;">
</a-plane>

<a-plane 
  src="#layer9-barca" 
  position="0 0 0.865" 
  rotation="0 0 0" 
  width="1" 
  height="1" 
  material="transparent: true; alphaTest: 0.1; side: double;">
</a-plane>

<a-plane 
  src="#layer9-floor" 
  position="0 -0.499 0.845" 
  rotation="-90 0 0" 
  width="1" 
  height="0.30" 
  material="transparent: true; alphaTest: 0.1; side: double;">
</a-plane>      
      
      <!-- LAYER 10 -->
      <a-plane src="#layer10" position="0 0 1.00" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
      <a-plane src="#layer10-back" position="0 0 0.98" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
<a-plane 
  src="#layer10-floor" 
  position="0 -0.499 0.935" 
  rotation="-90 0 0" 
  width="1" 
  height="0.12" 
  material="transparent: true; alphaTest: 0.1; side: double;">
</a-plane> 

      <!-- mostro -->
      <a-plane 
  src="#layer-mostro" 
  position="0 -0.499 0.35" 
  rotation="-90 0 0" 
  width="1" 
  height="0.30" 
  material="transparent: true; alphaTest: 0.1; side: double;">
</a-plane>
      
    </a-entity>
  </a-scene>
</body>
</html>
