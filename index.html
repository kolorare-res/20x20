<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove</title>

  <!-- Librerie A-Frame 1.4.2 e MindAR 1.2.5 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- File di configurazione -->
  <script src="./config.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 10;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Contenitore dell'opera riconosciuta: Altrove -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");

      const totalLayers = config.layers || 6;
      const maxDepth = config.maxDepth || 0.6; // Profondità accentuata per il grandangolo
      const openDur = config.openDuration || 1500;
      const stagger = config.staggerDelay || 120;
      const easingType = config.easing || "easeOutCubic";

      const stepDepth = totalLayers > 1 ? (maxDepth / (totalLayers - 1)) : 0;

      // ==========================================
      // 1. SCATOLA NATIVA DI FONDO (STRUTTURA 3D)
      // ==========================================
      // Un cubo molto sottile sul retro che fa da fondo solido alla scatola
      const boxBack = document.createElement("a-box");
      boxBack.setAttribute("width", "1");
      boxBack.setAttribute("height", "1");
      boxBack.setAttribute("depth", "0.02");
      boxBack.setAttribute("position", `0 0 -0.01`);
      boxBack.setAttribute("material", "color: #111111; roughness: 0.9;");
      targetEntity.appendChild(boxBack);

      // ==========================================
      // 2. LAYER Z CON EFFETTO PROSPETTICO "GRANDANGOLO"
      // ==========================================
      for (let i = 1; i <= totalLayers; i++) {
        const layerNumber = String(i).padStart(2, '0');
        const plane = document.createElement("a-plane");
        
        plane.setAttribute("src", `./images/layer${layerNumber}.png`);
        plane.setAttribute("width", "1");
        plane.setAttribute("height", "1");
        plane.setAttribute("position", "0 0 0");
        plane.setAttribute("scale", "1 1 1");
        
        plane.setAttribute("material", `
          transparent: true; 
          alphaTest: 0.5; 
          side: front;
          depthTest: true;
        `);
        
        plane.setAttribute("render-order", i);

        if (i > 1) {
          const targetZ = (i - 1) * stepDepth;
          const delayTime = (i - 1) * stagger;

          // Effetto grandangolo/prospettiva forzata: 
          // Più il layer è avanti, più viene scalato in grandezza (es. da 1.0 a 1.25)
          const scaleFactor = 1 + ((i - 1) / (totalLayers - 1)) * 0.28;

          // Annamiamo contemporaneamente la posizione Z e la scala per l'effetto ottico a tunnel
          plane.setAttribute("animation__pos", `
            property: position;
            from: 0 0 0;
            to: 0 0 ${targetZ.toFixed(4)};
            dur: ${openDur};
            delay: ${delayTime};
            easing: ${easingType};
            fill: forwards;
          `);

          plane.setAttribute("animation__scale", `
            property: scale;
            from: 1 1 1;
            to: ${scaleFactor} ${scaleFactor} 1;
            dur: ${openDur};
            delay: ${delayTime};
            easing: ${easingType};
            fill: forwards;
          `);
        }

        targetEntity.appendChild(plane);
      }
    });
  </script>

</body>
</html>
