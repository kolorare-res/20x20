<!DOCTYPE html>
<html lang="it">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diorama AR - MindAR</title>

    <!-- Librerie A-Frame e MindAR -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      /* FIX: Rimuove forzatamente la schermata azzurra e gli overlay di MindAR */
      .mindar-ui-loading,
      .mindar-ui-overlay {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <!-- CARICAMENTO ASSETS -->
      <a-assets>
        <img id="base-image" src="./assets/base.png" crossorigin="anonymous" />
        <img id="layer0" src="./assets/layer0.png" crossorigin="anonymous" />
        <img id="layer1" src="./assets/layer1.png" crossorigin="anonymous" />
        <img id="layer2" src="./assets/layer2.png" crossorigin="anonymous" />
        <img id="layer3" src="./assets/layer3.png" crossorigin="anonymous" />
        <img id="layer4" src="./assets/layer4.png" crossorigin="anonymous" />
        <img id="layer5" src="./assets/layer5.png" crossorigin="anonymous" />
        <img id="layer6" src="./assets/layer6.png" crossorigin="anonymous" />
        <img id="layer7" src="./assets/layer7.png" crossorigin="anonymous" />
        <img id="layer8" src="./assets/layer8.png" crossorigin="anonymous" />
        <img id="layer8-floor" src="./assets/layer8-floor.png" crossorigin="anonymous" />
        <img id="layer9" src="./assets/layer9.png" crossorigin="anonymous" />
        <img id="layer10" src="./assets/layer10.png" crossorigin="anonymous" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- TARGET ANCORAGGIO -->
      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- BASE INFERIORE (PAVIMENTO) -->
        <a-plane 
          src="#base-image" 
          position="0 -0.5 0.5" 
          rotation="-90 0 0" 
          width="1" 
          height="1" 
          material="transparent: true; alphaTest: 0.1; side: double;">
        </a-plane>

        <!-- 11 LAYER VERTICALI -->
        <a-plane src="#layer0" position="0 0 0.01" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
        <a-plane src="#layer1" position="0 0 0.10" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
        <a-plane src="#layer2" position="0 0 0.20" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
        <a-plane src="#layer3" position="0 0 0.30" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
        <a-plane src="#layer4" position="0 0 0.40" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
        <a-plane src="#layer5" position="0 0 0.50" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
        <a-plane src="#layer6" position="0 0 0.60" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
        <a-plane src="#layer7" position="0 0 0.70" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
        
        <!-- LAYER 8 E RELATIVA ESTENSIONE A TERRA -->
        <a-plane src="#layer8" position="0 0 0.80" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
        <a-plane 
          src="#layer8-floor" 
          position="0 -0.499 0.80" 
          rotation="-90 0 0" 
          width="1" 
          height="0.80" 
          material="transparent: true; alphaTest: 0.1; side: double;">
        </a-plane>

        <a-plane src="#layer9" position="0 0 0.90" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
        <a-plane src="#layer10" position="0 0 1.00" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>

      </a-entity>
    </a-scene>
  </body>
</html>
