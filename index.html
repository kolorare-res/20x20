<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <title>Altrove - AR Scene</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // 1. SMOOTH TRACKER
    AFRAME.registerComponent('smooth-tracker', {
      schema: { factor: { type: 'number', default: 0.35 } },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;
        const object3D = this.el.object3D;
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }
        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });

    // 2. OPT-PLANE
    AFRAME.registerComponent('opt-plane', {
      init: function () {
        this.el.setAttribute('material', { 
          shader: 'standard',
          color: '#fcfaf2',
          roughness: 0.8,
          metalness: 0.0,
          transparent: true,
          alphaTest: 0.01,
          depthWrite: false,
          side: 'double'
        });
      }
    });

    // 3. RENDER-ORDER
    AFRAME.registerComponent('render-order', {
      schema: { type: 'number', default: 0 },
      init: function () {
        this.applyOrder = this.applyOrder.bind(this);
        this.el.addEventListener('object3dset', this.applyOrder);
        this.applyOrder();
      },
      update: function () {
        this.applyOrder();
      },
      applyOrder: function () {
        const order = this.data;
        if (this.el.object3D) {
          this.el.object3D.renderOrder = order;
          this.el.object3D.traverse((node) => {
            node.renderOrder = order;
          });
        }
      }
    });

    // 4. 3D-BOX COMPONENT (Ancorato alla faccia frontale)
    AFRAME.registerComponent('3d-box', {
      schema: {
        width: { type: 'number', default: 1 },
        height: { type: 'number', default: 1 },
        depth: { type: 'number', default: 0.05 },
        src: { type: 'selector' },
        srcTop: { type: 'selector' },
        srcBottom: { type: 'selector' },
        srcLeft: { type: 'selector' },
        srcRight: { type: 'selector' }
      },
      init: function () {
        const el = this.el;
        const data = this.data;
        const loader = new THREE.TextureLoader();

        const createMat = (selector) => {
          if (!selector) {
            return new THREE.MeshStandardMaterial({ color: '#fcfaf2', roughness: 0.8 });
          }
          const texture = loader.load(selector.src);
          texture.encoding = THREE.sRGBEncoding;
          return new THREE.MeshStandardMaterial({ 
            map: texture, 
            transparent: true, 
            alphaTest: 0.1, 
            roughness: 0.8 
          });
        };

        const geometry = new THREE.BoxGeometry(data.width, data.height, data.depth);
        geometry.translate(0, 0, -data.depth / 2);

        const materials = [
          createMat(data.srcRight),
          createMat(data.srcLeft),
          createMat(data.srcTop),
          createMat(data.srcBottom),
          createMat(data.src),
          createMat(data.src)
        ];

        const mesh = new THREE.Mesh(geometry, materials);
        el.setObject3D('mesh', mesh);
      }
    });

// ANIMAZIONI

// FOGLIE CADENTI (Layer 1 Vegetazione)
AFRAME.registerComponent('falling-particles', {
  schema: {
    count: { type: 'int', default: 22 },
    zPos: { type: 'number', default: 0.32 },
    zVariance: { type: 'number', default: 0.03 },
    baseSizeMin: { type: 'number', default: 0.007 },
    baseSizeMax: { type: 'number', default: 0.02 },
    fallSpeedMin: { type: 'number', default: 0.0004 },
    fallSpeedMax: { type: 'number', default: 0.0008 },
    swayAmp: { type: 'number', default: 0.020 },
    enable3DRotation: { type: 'boolean', default: true },
    assetFolder: { type: 'string', default: './image/foglie/' },
    assetPrefix: { type: 'string', default: 'layer6-foglie-' },
    assetStart: { type: 'int', default: 1 },
    assetEnd: { type: 'int', default: 18 }
  },
  init: function () {
    this.particles = [];
    this.textureUrls = [];
    for (let i = this.data.assetStart; i <= this.data.assetEnd; i++) {
      const numStr = i.toString().padStart(2, '0');
      this.textureUrls.push(`${this.data.assetFolder}${this.data.assetPrefix}${numStr}.png`);
    }

    // Limiti per l'area vegetazione in basso a destra (Layer 1)
    this.bounds = {
      xMin:  0.000,
      xMax:  0.300,
      yMin: -0.350,
      yMax: -0.050,
      yKill: -0.450
    };

    const overlayMat = "transparent: true; alphaTest: 0.1; depthWrite: false; depthTest: true;";

    for (let i = 0; i < this.data.count; i++) {
      const pEl = document.createElement('a-plane');
      const randTexUrl = this.textureUrls[Math.floor(Math.random() * this.textureUrls.length)];
      const size = this.randomRange(this.data.baseSizeMin, this.data.baseSizeMax);
      
      pEl.setAttribute('width', size);
      pEl.setAttribute('height', size);
      pEl.setAttribute('material', `src: url(${randTexUrl}); ${overlayMat} side: double;`);

      this.el.appendChild(pEl);

      const pData = {
        el: pEl,
        xInit: this.randomRange(this.bounds.xMin, this.bounds.xMax),
        x: 0,
        y: this.randomRange(this.bounds.yMin, this.bounds.yMax),
        z: this.data.zPos + (Math.random() * this.data.zVariance - (this.data.zVariance / 2)),
        fallSpeed: this.randomRange(this.data.fallSpeedMin, this.data.fallSpeedMax),
        swayAmp: this.data.swayAmp * (0.8 + Math.random() * 0.4),
        swayFreq: 0.0018 + (Math.random() * 0.0015),
        rotSpeedZ: (Math.random() - 0.5) * 1.8,
        rotSpeedX: this.data.enable3DRotation ? (Math.random() - 0.5) * 1.2 : 0,
        rotZ: Math.random() * 360,
        rotX: this.data.enable3DRotation ? Math.random() * 360 : 0,
        timeOffset: Math.random() * 2000
      };

      pData.x = pData.xInit;
      this.particles.push(pData);
    }
  },
  randomRange: function (min, max) {
    return min + Math.random() * (max - min);
  },
  resetParticle: function (p) {
    p.xInit = this.randomRange(this.bounds.xMin, this.bounds.xMax);
    p.x = p.xInit;
    p.y = this.bounds.yMax;
    p.fallSpeed = this.randomRange(this.data.fallSpeedMin, this.data.fallSpeedMax);
    p.rotZ = Math.random() * 360;
  },
  tick: function (time, timeDelta) {
    if (!timeDelta) return;
    this.particles.forEach(p => {
      p.y -= p.fallSpeed * (timeDelta / 16.6);
      const sway = Math.sin((time + p.timeOffset) * p.swayFreq) * p.swayAmp;
      p.x = p.xInit + sway;
      p.rotZ += p.rotSpeedZ;
      if (this.data.enable3DRotation) p.rotX += p.rotSpeedX;

      p.el.object3D.position.set(p.x, p.y, p.z);
      p.el.object3D.rotation.z = THREE.MathUtils.degToRad(p.rotZ);
      if (this.data.enable3DRotation) {
        p.el.object3D.rotation.x = THREE.MathUtils.degToRad(p.rotX);
      }

      if (p.y < this.bounds.yKill) this.resetParticle(p);
    });
  }
});
    // FINE FOGLIE CADENTI

    // FARFALLA 3D - TRAIETTORIA A "8" (INFINITO ∞)
AFRAME.registerComponent('butterfly-3d-flight', {
  schema: {
    radiusX: { type: 'number', default: 0.09 },     // Ampiezza orizzontale
    radiusY: { type: 'number', default: 0.035 },    // Ampiezza verticale dell'8
    radiusZ: { type: 'number', default: 0.015 },    // Variazione profondità 3D
    flapAngle: { type: 'number', default: 45 },     // Angolo apertura ali
    flapSpeed: { type: 'number', default: 0.014 },    // Velocità battito ali
    flightSpeed: { type: 'number', default: 0.0012 }  // Velocità lungo l'8
  },
  init: function () {
    this.baseX = this.el.object3D.position.x;
    this.baseY = this.el.object3D.position.y;
    this.baseZ = this.el.object3D.position.z;
    this.timeFlight = 0;
    this.timeFlap = Math.random() * 100;
    this.wingLeft = this.el.querySelector('.wing-left');
    this.wingRight = this.el.querySelector('.wing-right');
  },
  tick: function (t, dt) {
    if (!dt) return;
    this.timeFlight += dt * this.data.flightSpeed;
    this.timeFlap += dt * this.data.flapSpeed;

    const tF = this.timeFlight;

    // Movimento a "8" orizzontale
    const offsetX = Math.sin(tF) * this.data.radiusX;
    const offsetY = Math.sin(2 * tF) * this.data.radiusY;
    const offsetZ = Math.cos(tF) * this.data.radiusZ;

    this.el.object3D.position.x = this.baseX + offsetX;
    this.el.object3D.position.y = this.baseY + offsetY;
    this.el.object3D.position.z = this.baseZ + offsetZ;

    // Battito ali
    const currentFlap = Math.sin(this.timeFlap) * this.data.flapAngle;
    if (this.wingLeft) this.wingLeft.object3D.rotation.y = THREE.MathUtils.degToRad(currentFlap);
    if (this.wingRight) this.wingRight.object3D.rotation.y = THREE.MathUtils.degToRad(-currentFlap);

    // Vettore velocità per orientamento testa
    const velX = Math.cos(tF) * this.data.radiusX;
    const velY = 2 * Math.cos(2 * tF) * this.data.radiusY;
    const heading = Math.atan2(velY, velX);

    this.el.object3D.rotation.z = heading - Math.PI / 2;
  }
});
    // FINE FARFALLA


// PULVISCOLO TIPOGRAFICO DIFFUSO OMOGENEO SUI LIVELLI
AFRAME.registerComponent('typo-cloud', {
  schema: {
    totalChars: { type: 'int', default: 200 },
    minScale: { type: 'number', default: 0.08 },
    maxScale: { type: 'number', default: 0.22 },
    color: { type: 'string', default: '#1A1412' },
    font: { type: 'string', default: 'dejavu' },
    driftSpeed: { type: 'number', default: 0.0004 },
    charSet: { type: 'string', default: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz' },
    // Limiti del volume 3D entro cui diffondere i caratteri
    xMin: { type: 'number', default: -0.45 },
    xMax: { type: 'number', default: 0.45 },
    yMin: { type: 'number', default: -0.40 },
    yMax: { type: 'number', default: 0.40 },
    zMin: { type: 'number', default: 0.02 }, // Inizia subito dopo lo sfondo Layer 0
    zMax: { type: 'number', default: 0.35 }  // Arriva davanti al Layer 1
  },
  init: function () {
    this.nodes = [];
    const chars = Array.from(this.data.charSet);

    for (let i = 0; i < this.data.totalChars; i++) {
      const charEl = document.createElement('a-entity');
      const randomChar = chars[Math.floor(Math.random() * chars.length)];

      // Distribuzione casuale uniforme nel volume 3D
      const posX = this.data.xMin + Math.random() * (this.data.xMax - this.data.xMin);
      const posY = this.data.yMin + Math.random() * (this.data.yMax - this.data.yMin);
      const posZ = this.data.zMin + Math.random() * (this.data.zMax - this.data.zMin);

      const scale = this.data.minScale + Math.random() * (this.data.maxScale - this.data.minScale);
      const baseOpacity = 0.55 + Math.random() * 0.45; // Trasparenza variabile per maggiore profondità

      charEl.setAttribute('text', {
        value: randomChar,
        align: 'center',
        anchor: 'center',
        font: this.data.font,
        color: this.data.color,
        side: 'double',
        opacity: baseOpacity,
        width: 2,
        transparent: true
      });

      charEl.setAttribute('scale', `${scale} ${scale} ${scale}`);
      charEl.setAttribute('position', `${posX} ${posY} ${posZ}`);
      charEl.setAttribute('rotation', `${(Math.random() - 0.5) * 20} ${(Math.random() - 0.5) * 45} 0`);

      this.el.appendChild(charEl);

      this.nodes.push({
        el: charEl,
        basePos: { x: posX, y: posY, z: posZ },
        rotY: (Math.random() - 0.5) * 0.2,
        freq: 0.5 + Math.random() * 1.0,
        phase: Math.random() * Math.PI * 2,
        amp: 0.008 + Math.random() * 0.015
      });
    }
  },
  tick: function (time, dt) {
  if (!dt) return;

  this.nodes.forEach(node => {
    const t = time * this.data.driftSpeed * node.freq + node.phase;

    const offsetX = Math.sin(t) * node.amp;
    const offsetY = Math.cos(t * 0.8) * node.amp * 1.5;
    const offsetZ = Math.sin(t * 1.2) * node.amp;

    node.el.object3D.position.x = node.basePos.x + offsetX;
    node.el.object3D.position.y = node.basePos.y + offsetY;
    node.el.object3D.position.z = node.basePos.z + offsetZ;

    // Rotazione rallentata (moltiplicatore ridotto da 0.001 a 0.0002 per un effetto più ipnotico)
    node.el.object3D.rotation.y += node.rotY * 0.0002;
  });
}
});
    // FINE PULVISCOLO TIPOGRAFICO
    
  </script>

<!-- FARFALLA LAYER 2 (Volo a 8 esteso oltre il fiore di sinistra) -->
