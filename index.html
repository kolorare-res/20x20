<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mostra AR - Poetica della Pagina</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- File di configurazione -->
  <script src="./config.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Aggiunti i filtri di lisciamento (filterMinCF e filterBeta) per eliminare il tremolio -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Contenitore dell'opera riconosciuta -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");

      // Calcolo dello spazio tra i livelli
      const stepDepth = config.layers > 1 ? (config.maxDepth / (config.layers - 1)) : 0;

      for (let i = 1; i <= config.layers; i++) {
        const layerNumber = String(i).padStart(2, '0');
        const imagePath = `./images/layer${layerNumber}.png`;
        const targetZ = -((i - 1) * stepDepth);

        const plane = document.createElement("a-plane");
        plane.setAttribute("src", imagePath);
        plane.setAttribute("width", "1");
        plane.setAttribute("height", "1");
        plane.setAttribute("position", "0 0 0");
        plane.setAttribute("material", "transparent: true; alphaTest: 0.5;");

        // L'animazione parte da 0 e si ferma a targetZ senza mai tornare indietro
        if (i > 1) {
          plane.setAttribute("animation", {
            property: "position",
            to: `0 0 ${targetZ.toFixed(4)}`,
            dur: config.openDuration,
            easing: config.easing,
            fill: "forwards" // Mantiene la posizione finale e NON si richiude
          });
        }

        targetEntity.appendChild(plane);
      }
    });
  </script>

</body>
</html>
