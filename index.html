<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mostra AR - Poetica della Pagina</title>

  <!-- Libreria A-Frame 1.4.2 e MindAR 1.2.5 (Combinazione più stabile in assoluto) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- File di configurazione -->
  <script src="./config.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 10;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Contenitore dell'opera riconosciuta -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");

      // Recupero tempi e parametri dal file config.js
      const pageAnimDur = config.pageOpenDuration || 1800;
      const pageAngle = config.pageOpenAngle || 120;
      const pageEasing = config.pageEasing || "easeOutCubic";
      const baseLayersDelay = config.sequenceMode ? pageAnimDur : 0;

      // ==========================================
      // FASE 1: CREAZIONE E APERTURA DELLE 3 PAGINE (CERNIERA)
      // ==========================================
      const pagesConfig = [
        {
          id: "page-left",
          image: "./images/page_left.png",
          pivotPos: "-0.5 0 0",
          planeOffset: "-0.5 0 0",
          toRot: `0 ${pageAngle} 0`
        },
        {
          id: "page-right",
          image: "./images/page_right.png",
          pivotPos: "0.5 0 0",
          planeOffset: "0.5 0 0",
          toRot: `0 -${pageAngle} 0`
        },
        {
          id: "page-bottom",
          image: "./images/page_bottom.png",
          pivotPos: "0 -0.5 0",
          planeOffset: "0 -0.5 0",
          toRot: `-${pageAngle} 0 0`
        }
      ];

      pagesConfig.forEach((p, index) => {
        // Entità Pivot (Perno di cerniera)
        const pivot = document.createElement("a-entity");
        pivot.setAttribute("position", p.pivotPos);
        pivot.setAttribute("rotation", "0 0 0");

        // Piano grafico della pagina
        const pagePlane = document.createElement("a-plane");
        pagePlane.setAttribute("src", p.image);
        pagePlane.setAttribute("width", "1");
        pagePlane.setAttribute("height", "1");
        pagePlane.setAttribute("position", p.planeOffset);
        
        pagePlane.setAttribute("material", `
          transparent: true; 
          alphaTest: 0.5; 
          side: double;
          depthTest: true;
        `);
        
        pagePlane.setAttribute("render-order", 20 + index);

        // Attacchiamo l'animazione al pivot usando la sintassi nativa di A-Frame
        pivot.setAttribute("animation", `
          property: rotation; 
          from: 0 0 0; 
          to: ${p.toRot}; 
          dur: ${pageAnimDur}; 
          easing: ${pageEasing}; 
          dir: normal;
          fill: forwards;
        `);

        pivot.appendChild(pagePlane);
        targetEntity.appendChild(pivot);
      });

      // ==========================================
      // FASE 2: ESTRAZIONE PROGRESSIVA DEI LAYER Z
      // ==========================================
      const stepDepth = config.layers > 1 ? (config.maxDepth / (config.layers - 1)) : 0;

      for (let i = 1; i <= config.layers; i++) {
        const layerNumber = String(i).padStart(2, '0');
        const imagePath = `./images/layer${layerNumber}.png`;
        const targetZ = (i - 1) * stepDepth;

        const plane = document.createElement("a-plane");
        plane.setAttribute("src", imagePath);
        plane.setAttribute("width", "1");
        plane.setAttribute("height", "1");
        plane.setAttribute("position", "0 0 0");
        plane.setAttribute("rotation", "0 0 0");
        
        plane.setAttribute("material", `
          transparent: true; 
          alphaTest: 0.5; 
          side: front;
          depthTest: true;
        `);
        
        plane.setAttribute("render-order", i);

        // Ritardo per far partire i layer DOPO l'apertura delle pagine
        const layerDelay = baseLayersDelay + ((i - 1) * (config.staggerDelay || 80));

        if (i > 1) {
          plane.setAttribute("animation", `
            property: position; 
            from: 0 0 0; 
            to: 0 0 ${targetZ.toFixed(4)}; 
            dur: ${config.openDuration}; 
            delay: ${layerDelay}; 
            easing: ${config.easing}; 
            fill: forwards;
          `);
        }

        targetEntity.appendChild(plane);
      }
    });
  </script>

</body>
</html>
