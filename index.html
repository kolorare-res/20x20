<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame & MindAR Libraries -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- Sostituisci mindar-image="imageTargetSrc: ./target.mind;" con il tuo file di tracking -->
    <a-scene 
      mindar-image="imageTargetSrc: ./target.mind; autoStart: true; uiLoading: no; uiError: no;" 
      embedded 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Inserisci qui le texture per pagine, legno o foglie se usate -->
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- 1. BASE: Sfondo di pagine di libro che emerge dal foglio -->
        <a-plane position="0 0 0" width="1" height="1" material="color: #f4f1ea; opacity: 0.9;" rotation="0 0 0"></a-plane>

        <!-- 2. IL LAMPIONE E IL CONO DI LUCE (Diagonale Narrativa) -->
        <!-- Palo del Lampione -->
        <a-cylinder position="0.35 0.1 0.15" radius="0.008" height="0.6" color="#1a1a1a" rotation="0 0 -15"></a-cylinder>
        
        <!-- Cono di Luce (Semi-trasparente, depthWrite false per non fare clipping) -->
        <a-cone 
          position="0.1 -0.05 0.2" 
          radius-bottom="0.35" 
          radius-top="0.02" 
          height="0.7" 
          rotation="0 0 40" 
          material="color: #fbd532; transparent: true; opacity: 0.45; depthWrite: false; side: Double">
        </a-cone>

        <!-- 3. IL VIAGGIO: Bacino d'acqua e Barca (Primo Piano in Basso) -->
        <!-- Piano Acqua -->
        <a-cylinder position="-0.2 -0.25 0.15" radius="0.22" height="0.02" material="color: #2b5c8f; transparent: true; opacity: 0.75;"></a-cylinder>
        
        <!-- Scafo Barca -->
        <a-entity id="barca" position="-0.2 -0.23 0.18" animation="property: position; to: -0.2 -0.21 0.18; dir: alternate; dur: 2500; loop: true; easing: sine">
          <!-- Scafo -->
          <a-cone radius-bottom="0.06" radius-top="0" height="0.04" rotation="0 0 180" scale="1 1 2" material="color: #3e2723;"></a-cone>
          <!-- Vela di carta -->
          <a-triangle vertex-a="0 0.08 0" vertex-b="-0.04 0 0" vertex-c="0.04 0 0" material="color: #f4f1ea; side: Double" position="0 0.04 0"></a-triangle>
        </a-entity>

        <!-- 4. MOVIMENTO ATMOSFERICO: Lettere che cadono (Metamorfosi della parola) -->
        <!-- Lettera 'A' -->
        <a-text value="A" position="0.2 0.3 0.25" scale="0.2 0.2 0.2" color="#1a1a1a"
                animation="property: position; to: 0.0 -0.3 0.25; dur: 4500; loop: true; easing: linear; delay: 200"
                animation__rotation="property: rotation; to: 0 360 45; dur: 4500; loop: true; easing: linear">
        </a-text>

        <!-- Lettera 'M' -->
        <a-text value="M" position="0.05 0.35 0.18" scale="0.18 0.18 0.18" color="#1a1a1a"
                animation="property: position; to: -0.15 -0.25 0.18; dur: 5200; loop: true; easing: linear; delay: 1000"
                animation__rotation="property: rotation; to: 180 180 0; dur: 5200; loop: true; easing: linear">
        </a-text>

        <!-- Foglia / Parola che attraversa il cono di luce -->
        <a-plane position="0.25 0.2 0.2" width="0.04" height="0.06" material="color: #4caf50; side: Double"
                 animation="property: position; to: 0.05 -0.3 0.2; dur: 3800; loop: true; easing: linear; delay: 500"
                 animation__rot="property: rotation; to: 360 180 90; dur: 3800; loop: true; easing: linear">
        </a-plane>

      </a-entity>
    </a-scene>
  </body>
</html>
