<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mostra AR - Poetica della Pagina</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- File di configurazione -->
  <script src="./config.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- STABILIZZAZIONE ATTIVA: filterMinCF e filterBeta per evitare tremolii -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 10;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Contenitore dell'opera riconosciuta -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

 <script>
  document.addEventListener("DOMContentLoaded", () => {
    const targetEntity = document.querySelector("#ar-target");

    // Calcoliamo lo spazio tra ciascun livello
    const stepDepth = config.layers > 1 ? (config.maxDepth / (config.layers - 1)) : 0;

    for (let i = 1; i <= config.layers; i++) {
      const layerNumber = String(i).padStart(2, '0');
      const imagePath = `./images/layer${layerNumber}.png`;

      // Avanzamento Z in avanti verso la fotocamera (effetto Pop-up)
      const targetZ = (i - 1) * stepDepth;

      const plane = document.createElement("a-plane");
      plane.setAttribute("src", imagePath);
      plane.setAttribute("width", "1");
      plane.setAttribute("height", "1");
      
      // Coordinate e rotazioni di partenza rigide al centro
      plane.setAttribute("position", "0 0 0");
      plane.setAttribute("rotation", "0 0 0");
      
      // FIX MISTERO SPECCHIAMENTO / DOPPIA IMMAGINE:
      // 1. repeat: 1 1 -> Impedisce ad A-Frame di ripetere la texture sui bordi
      // 2. npot: true -> Gestisce le immagini con trasparenze asimmetriche o dimensioni non standard
      plane.setAttribute("material", `
        transparent: true; 
        alphaTest: 0.5; 
        side: front;
        repeat: 1 1;
        depthTest: true;
      `);
      
      // Assegniamo un ordine di rendering crescente per evitare errori di sovrapposizione
      plane.setAttribute("render-order", i);

      if (i > 1) {
        plane.setAttribute("animation", {
          property: "position",
          from: "0 0 0",
          to: `0 0 ${targetZ.toFixed(4)}`,
          dur: config.openDuration,
          easing: config.easing,
          fill: "forwards"
        });
      }

      targetEntity.appendChild(plane);
    }
  });
</script>

</body>
</html>
