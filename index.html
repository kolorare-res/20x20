<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove - Setup Tracciamento e Scatole 3D</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // 1. SMOOTH TRACKER
    AFRAME.registerComponent('smooth-tracker', {
      schema: { factor: { type: 'number', default: 0.35 } },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;
        const object3D = this.el.object3D;
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }
        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });

    // 2. OPT-PLANE
    AFRAME.registerComponent('opt-plane', {
      init: function () {
        this.el.setAttribute('material', { 
          shader: 'standard',
          color: '#fcfaf2',
          roughness: 0.8,
          metalness: 0.0,
          transparent: true,
          alphaTest: 0.01,
          depthWrite: false,
          side: 'double'
        });
      }
    });

    // 3. RENDER-ORDER
    AFRAME.registerComponent('render-order', {
      schema: { type: 'number', default: 0 },
      init: function () {
        this.applyOrder = this.applyOrder.bind(this);
        this.el.addEventListener('object3dset', this.applyOrder);
        this.applyOrder();
      },
      update: function () {
        this.applyOrder();
      },
      applyOrder: function () {
        const order = this.data;
        if (this.el.object3D) {
          this.el.object3D.renderOrder = order;
          this.el.object3D.traverse((node) => {
            node.renderOrder = order;
          });
        }
      }
    });

    // 4. 3D-BOX COMPONENT (Ancorato alla faccia frontale)
    AFRAME.registerComponent('3d-box', {
      schema: {
        width: { type: 'number', default: 1 },
        height: { type: 'number', default: 1 },
        depth: { type: 'number', default: 0.05 },
        src: { type: 'selector' },
        srcTop: { type: 'selector' },
        srcBottom: { type: 'selector' },
        srcLeft: { type: 'selector' },
        srcRight: { type: 'selector' }
      },
      init: function () {
        const el = this.el;
        const data = this.data;
        const loader = new THREE.TextureLoader();

        const createMat = (selector) => {
          if (!selector) {
            return new THREE.MeshStandardMaterial({ color: '#fcfaf2', roughness: 0.8 });
          }
          const texture = loader.load(selector.src);
          texture.encoding = THREE.sRGBEncoding;
          return new THREE.MeshStandardMaterial({ 
            map: texture, 
            transparent: true, 
            alphaTest: 0.1, 
            roughness: 0.8 
          });
        };

        const geometry = new THREE.BoxGeometry(data.width, data.height, data.depth);
        // Trasla l'origine della geometria all'indietro così che Z coincida con la faccia frontale
        geometry.translate(0, 0, -data.depth / 2);

        const materials = [
          createMat(data.srcRight),
          createMat(data.srcLeft),
          createMat(data.srcTop),
          createMat(data.srcBottom),
          createMat(data.src),
          createMat(data.src)
        ];

        const mesh = new THREE.Mesh(geometry, materials);
        el.setObject3D('mesh', mesh);
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
    .mindar-ui-loading, div[class*="mindar-ui"] { display: none !important; }

    #editor-ui {
      position: fixed;
      top: 12px;
      right: 12px;
      left: auto;
      bottom: auto;
      z-index: 999999;
      background: rgba(18, 18, 22, 0.92);
      color: #e1e1e1;
      padding: 12px;
      border-radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      width: 290px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
    }
    #editor-ui.collapsed #editor-body { display: none; }
    #editor-ui header {
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #3897f0;
      letter-spacing: 0.5px;
    }
    #editor-ui header button {
      background: #2c2c2e; color: #aaa; border: 1px solid #444; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 10px;
    }
    #editor-body { margin-top: 8px; }
    .section-title { font-weight: bold; color: #3897f0; margin: 8px 0 4px 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
    #editor-ui select, #editor-ui input, #editor-ui button {
      background: #252528; color: #fff; border: 1px solid #3a3a3c; padding: 4px; border-radius: 4px; font-size: 10px;
    }
    #editor-ui select { width: 100%; margin-bottom: 6px; }
    .ui-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .ui-row label { width: 36px; font-weight: bold; color: #8e8e93; }
    .ui-row input[type="number"] { width: 55px; text-align: right; }
    .ui-row input[type="range"] { flex: 1; accent-color: #3897f0; }
    .btn-group { display: flex; gap: 6px; margin-top: 8px; }
    .btn-group button { flex: 1; cursor: pointer; background: #007aff; border: none; font-weight: 600; color: #fff; padding: 6px; border-radius: 4px; }
    #export-output {
      display: none; width: 100%; height: 100px; margin-top: 6px; background: #0d0d0e; color: #34c759; font-family: monospace; font-size: 9px; resize: vertical; box-sizing: border-box;
    }
  </style>
</head>

<body>

  <div id="editor-ui">
    <header>
      <span>AR BOX & LAYER EDITOR</span>
      <button id="btn-toggle">Nascondi</button>
    </header>

    <div id="editor-body">
      <label for="plane-select" style="display:block; margin-bottom: 2px; color: #8e8e93;">Seleziona Elemento:</label>
      <select id="plane-select"></select>

      <div class="section-title">POSIZIONE (X, Y, Z)</div>
      <div class="ui-row">
        <label>X</label>
        <input type="number" id="posX-num" step="0.005">
        <input type="range" id="posX-range" min="-1" max="1" step="0.005">
      </div>
      <div class="ui-row">
        <label>Y</label>
        <input type="number" id="posY-num" step="0.005">
        <input type="range" id="posY-range" min="-1" max="1" step="0.005">
      </div>
      <div class="ui-row">
        <label>Z</label>
        <input type="number" id="posZ-num" step="0.001">
        <input type="range" id="posZ-range" min="-0.1" max="0.5" step="0.001">
      </div>

      <div class="section-title">ROTAZIONE (RotX, RotY, RotZ)</div>
      <div class="ui-row">
        <label>RotX</label>
        <input type="number" id="rotX-num" step="1">
        <input type="range" id="rotX-range" min="-180" max="180" step="1">
      </div>
      <div class="ui-row">
        <label>RotY</label>
        <input type="number" id="rotY-num" step="1">
        <input type="range" id="rotY-range" min="-180" max="180" step="1">
      </div>
      <div class="ui-row">
        <label>RotZ (Inclinazione)</label>
        <input type="number" id="rotZ-num" step="1">
        <input type="range" id="rotZ-range" min="-180" max="180" step="1">
      </div>

      <div class="btn-group">
        <button id="btn-refresh" style="background: #3a3a3c;">Aggiorna</button>
        <button id="btn-export">Genera HTML</button>
      </div>
      <textarea id="export-output" readonly></textarea>
    </div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5; autoStart: true; uiLoading: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;" 
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- ASSETS PRELOAD -->
    <a-assets>
      <!-- Layer 0 -->
      <img id="layer0" src="./image/layer0.png">

      <!-- Layer 1 -->
      <img id="layer1" src="./image/layer1.png">
      <img id="obj-1" src="./image/obj-1.png">
      <img id="layer1-top" src="./image/layer1-top.png">
      <img id="layer1-bottom" src="./image/layer1-bottom.png">

      <!-- Layer 2 -->
      <img id="layer2" src="./image/layer2.png">
      <img id="obj-2" src="./image/obj-2.png">
      <img id="layer2-top" src="./image/layer2-top.png">
      <img id="layer2-bottom" src="./image/layer2-bottom.png">

      <!-- Layer 3 -->
      <img id="layer3" src="./image/layer3.png">
      <img id="obj-3" src="./image/obj-3.png">
      <img id="layer3-top" src="./image/layer3-top.png">
      <img id="layer3-bottom" src="./image/layer3-bottom.png">

      <!-- Layer 4 -->
      <img id="layer4" src="./image/layer4.png">
      <img id="obj-4" src="./image/obj-4.png">
      <img id="layer4-top" src="./image/layer4-top.png">
      <img id="layer4-bottom" src="./image/layer4-bottom.png">

      <!-- Layer 5 -->
      <img id="layer5" src="./image/layer5.png">
      <img id="obj-5" src="./image/obj-5.png">
      <img id="layer5-top" src="./image/layer5-top.png">
      <img id="layer5-bottom" src="./image/layer5-bottom.png">

      <!-- Layer 6 -->
      <img id="layer6" src="./image/layer6.png">
      <img id="obj-6" src="./image/obj-6.png">
      <img id="layer6-top" src="./image/layer6-top.png">
      <img id="layer6-bottom" src="./image/layer6-bottom.png">

      <!-- Layer 7 -->
      <img id="layer7" src="./image/layer7.png">
      <img id="layer7-top" src="./image/layer7-top.png">
      <img id="layer7-bottom" src="./image/layer7-bottom.png">

      <!-- Elementi Extra -->
      <img id="omino" src="./image/omino.png">
    </a-assets>

    <!-- LUCI -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.1;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.4" position="1 2 1"></a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- TRACCIAMENTO TARGET -->
    <a-entity mindar-image-target="targetIndex: 0" smooth-tracker="factor: 0.35">
      
      <!-- 0. Z = 0.005 (Layer 0 Sfondo) -->
      <a-plane id="plane-layer0" class="editable" opt-plane src="#layer0" position="0.000 0.000 0.005" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- 1. SCATOLA LAYER 5 (Barca) - Z = 0.025 -->
      <a-entity 
        id="box-layer5" 
        class="editable" 
        3d-box="
          src: #layer5; 
          srcTop: #layer5-top; 
          srcBottom: #layer5-bottom; 
          width: 0.1141; 
          height: 0.0248; 
          depth: 0.025;" 
        position="0.000 0.000 0.025" 
        rotation="0 0 356.687">
      </a-entity>

      <!-- Oggetto 5 -->
      <a-plane id="plane-obj5" class="editable" opt-plane src="#obj-5" position="0.000 0.000 0.032" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- 2. SCATOLA LAYER 4 (Pesce) - Z = 0.040 -->
      <a-entity 
        id="box-layer4" 
        class="editable" 
        3d-box="
          src: #layer4; 
          srcTop: #layer4-top; 
          srcBottom: #layer4-bottom; 
          width: 0.1191; 
          height: 0.0176; 
          depth: 0.040;" 
        position="0.000 0.000 0.040" 
        rotation="0 0 357.73">
      </a-entity>

      <!-- Oggetto 4 -->
      <a-plane id="plane-obj4" class="editable" opt-plane src="#obj-4" position="0.000 0.000 0.042" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- Elemento Omino Sfondo -->
      <a-plane id="plane-omino" class="editable" opt-plane src="#omino" position="0.000 0.000 0.080" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- 3. SCATOLA LAYER 7 (Omino Box) - Z = 0.100 -->
      <a-entity 
        id="box-layer7" 
        class="editable" 
        3d-box="
          src: #layer7; 
          srcTop: #layer7-top; 
          srcBottom: #layer7-bottom; 
          width: 0.1252; 
          height: 0.0260; 
          depth: 0.100;" 
        position="0.000 0.000 0.100" 
        rotation="0 0 3.302">
      </a-entity>

      <!-- 4. SCATOLA LAYER 6 (Case) - Z = 0.179 -->
      <a-entity 
        id="box-layer6" 
        class="editable" 
        3d-box="
          src: #layer6; 
          srcTop: #layer6-top; 
          srcBottom: #layer6-bottom; 
          width: 0.1118; 
          height: 0.0123; 
          depth: 0.179;" 
        position="0.000 0.000 0.179" 
        rotation="0 0 357.794">
      </a-entity>

      <!-- 5. SCATOLA LAYER 3 (Lampione) - Z = 0.184 -->
      <a-entity 
        id="box-layer3" 
        class="editable" 
        3d-box="
          src: #layer3; 
          srcTop: #layer3-top; 
          srcBottom: #layer3-bottom; 
          width: 0.1236; 
          height: 0.0221; 
          depth: 0.184;" 
        position="0.000 0.000 0.184" 
        rotation="0 0 189.397">
      </a-entity>

      <!-- Oggetto 3 -->
      <a-plane id="plane-obj3" class="editable" opt-plane src="#obj-3" position="0.000 0.000 0.186" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- 6. SCATOLA LAYER 2 (Fiori) - Z = 0.200 -->
      <a-entity 
        id="box-layer2" 
        class="editable" 
        3d-box="
          src: #layer2; 
          srcTop: #layer2-top; 
          srcBottom: #layer2-bottom; 
          width: 0.1140; 
          height: 0.0237; 
          depth: 0.200;" 
        position="0.000 0.000 0.200" 
        rotation="0 0 0">
      </a-entity>

      <!-- Oggetti 6 e 2 -->
      <a-plane id="plane-obj6" class="editable" opt-plane src="#obj-6" position="0.000 0.000 0.205" rotation="0 0 0" width="1" height="1"></a-plane>
      <a-plane id="plane-obj2" class="editable" opt-plane src="#obj-2" position="0.000 0.000 0.220" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- 7. SCATOLA LAYER 1 (Box Principale) - Z = 0.300 -->
      <a-entity 
        id="box-layer1"
        class="editable"
        3d-box="
          src: #layer1; 
          srcTop: #layer1-top; 
          srcBottom: #layer1-bottom; 
          width: 0.616; 
          height: 0.052; 
          depth: 0.300;" 
        position="0.000 0.300 0.300" 
        rotation="0 0 0">
      </a-entity>

      <!-- Oggetto 1 -->
      <a-plane id="plane-obj1" class="editable" opt-plane src="#obj-1" position="0.000 0.000 0.320" rotation="0 0 0" width="1" height="1"></a-plane>

    </a-entity>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('plane-select');
      
      const posXNum = document.getElementById('posX-num');
      const posXRange = document.getElementById('posX-range');
      const posYNum = document.getElementById('posY-num');
      const posYRange = document.getElementById('posY-range');
      const posZNum = document.getElementById('posZ-num');
      const posZRange = document.getElementById('posZ-range');

      const rotXNum = document.getElementById('rotX-num');
      const rotXRange = document.getElementById('rotX-range');
      const rotYNum = document.getElementById('rotY-num');
      const rotYRange = document.getElementById('rotY-range');
      const rotZNum = document.getElementById('rotZ-num');
      const rotZRange = document.getElementById('rotZ-range');

      const btnExport = document.getElementById('btn-export');
      const btnRefresh = document.getElementById('btn-refresh');
      const btnToggle = document.getElementById('btn-toggle');
      const editorUI = document.getElementById('editor-ui');
      const exportOutput = document.getElementById('export-output');

      let elements = [];
      let selectedElement = null;

      function scanElements() {
        elements = Array.from(document.querySelectorAll('.editable'));
        select.innerHTML = '';
        
        elements.forEach((el, index) => {
          const idAttr = el.id ? `#${el.id}` : `elem-${index + 1}`;
          const is3DBox = el.hasAttribute('3d-box');
          const tagType = is3DBox ? '[3D-BOX]' : (el.tagName.toLowerCase() === 'a-entity' ? '[WRAPPER]' : '[PLANE]');
          const label = `${idAttr} ${tagType}`;
          
          const option = document.createElement('option');
          option.value = index;
          option.textContent = label;
          select.appendChild(option);
        });

        if (elements.length > 0) selectElement(0);
      }

      function selectElement(index) {
        selectedElement = elements[index];
        if (!selectedElement) return;
        
        const pos = selectedElement.getAttribute('position') || { x: 0, y: 0, z: 0 };
        const rot = selectedElement.getAttribute('rotation') || { x: 0, y: 0, z: 0 };

        updateUIValues(pos, rot);
      }

      function updateUIValues(pos, rot) {
        posXNum.value = Number(pos.x).toFixed(3); posXRange.value = pos.x;
        posYNum.value = Number(pos.y).toFixed(3); posYRange.value = pos.y;
        posZNum.value = Number(pos.z).toFixed(3); posZRange.value = pos.z;

        rotXNum.value = Math.round(rot.x); rotXRange.value = rot.x;
        rotYNum.value = Math.round(rot.y); rotYRange.value = rot.y;
        rotZNum.value = Math.round(rot.z); rotZRange.value = rot.z;
      }

      function applyTransform() {
        if (!selectedElement) return;
        const px = parseFloat(posXNum.value) || 0;
        const py = parseFloat(posYNum.value) || 0;
        const pz = parseFloat(posZNum.value) || 0;

        const rx = parseFloat(rotXNum.value) || 0;
        const ry = parseFloat(rotYNum.value) || 0;
        const rz = parseFloat(rotZNum.value) || 0;

        selectedElement.setAttribute('position', `${px} ${py} ${pz}`);
        selectedElement.setAttribute('rotation', `${rx} ${ry} ${rz}`);
      }

      function bindControl(numEl, rangeEl) {
        numEl.addEventListener('input', () => { rangeEl.value = numEl.value; applyTransform(); });
        rangeEl.addEventListener('input', () => { numEl.value = rangeEl.value; applyTransform(); });
      }

      bindControl(posXNum, posXRange);
      bindControl(posYNum, posYRange);
      bindControl(posZNum, posZRange);

      bindControl(rotXNum, rotXRange);
      bindControl(rotYNum, rotYRange);
      bindControl(rotZNum, rotZRange);

      select.addEventListener('change', (e) => selectElement(e.target.value));
      btnRefresh.addEventListener('click', scanElements);

      btnToggle.addEventListener('click', () => {
        editorUI.classList.toggle('collapsed');
        btnToggle.textContent = editorUI.classList.contains('collapsed') ? 'Mostra' : 'Nascondi';
      });

      btnExport.addEventListener('click', () => {
        let outputHTML = '';
        elements.forEach(el => {
          const id = el.id ? `id="${el.id}" ` : '';
          const pos = el.getAttribute('position');
          const rot = el.getAttribute('rotation') || { x: 0, y: 0, z: 0 };

          const posX = Number(pos.x).toFixed(3);
          const posY = Number(pos.y).toFixed(3);
          const posZ = Number(pos.z).toFixed(3);

          const rotX = Math.round(rot.x);
          const rotY = Math.round(rot.y);
          const rotZ = Math.round(rot.z);

          if (el.hasAttribute('3d-box')) {
            const boxData = el.getAttribute('3d-box');
            outputHTML += `<a-entity ${id}class="editable" 3d-box="${boxData}" position="${posX} ${posY} ${posZ}" rotation="${rotX} ${rotY} ${rotZ}"></a-entity>\n`;
          } else {
            const src = el.getAttribute('src') ? `src="${el.getAttribute('src')}" ` : '';
            const w = el.getAttribute('width') || '1';
            const h = el.getAttribute('height') || '1';

            outputHTML += `<a-plane ${id}class="editable" opt-plane ${src}position="${posX} ${posY} ${posZ}" rotation="${rotX} ${rotY} ${rotZ}" width="${w}" height="${h}"></a-plane>\n`;
          }
        });

        exportOutput.value = outputHTML;
        exportOutput.style.display = 'block';
        exportOutput.select();
      });

      const scene = document.querySelector('a-scene');
      if (scene.hasLoaded) scanElements();
      else scene.addEventListener('loaded', scanElements);
    });
  </script>
</body>
</html>
