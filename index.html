<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // Componente Smooth Tracker
    AFRAME.registerComponent('smooth-tracker', {
      schema: { factor: { type: 'number', default: 0.35 } },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;
        const object3D = this.el.object3D;
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }
        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });
      // MOVIMENTO OCCHI MOSTRO
// 1. IRIDE: Movimento biologico iper-scattante (saccadi reali)
AFRAME.registerComponent('eye-movement', {
  schema: {
    rangeZ: { type: 'number', default: 0.0065 },    // Escursione di 1.3 cm totali (±0.65 cm dal centro)
    minPause: { type: 'number', default: 400 },      // Pausa minima tra le occhiate (0.4s)
    maxPause: { type: 'number', default: 1800 },     // Pausa massima tra le occhiate (1.8s)
    moveDuration: { type: 'number', default: 90 }    // Scatto ultra-rapido (90 ms per un effetto fulmineo)
  },

  init: function () {
    this.baseZ = this.el.object3D.position.z;
    this.currentZ = this.baseZ;
    this.targetZ = this.baseZ;
    
    this.isMoving = false;
    this.moveTimer = 0;
    this.pauseTimer = 0;
    this.pauseDuration = this.getRandomPause();
  },

  getRandomPause: function () {
    return Math.random() * (this.data.maxPause - this.data.minPause) + this.data.minPause;
  },

  getRandomTargetZ: function () {
    const randomOffset = (Math.random() * 2 - 1) * this.data.rangeZ;
    return this.baseZ + randomOffset;
  },

  tick: function (t, dt) {
    if (!dt) return;

    if (this.isMoving) {
      this.moveTimer += dt;
      const progress = Math.min(this.moveTimer / this.data.moveDuration, 1);
      
      // Funzione di easing "Expo Out" per un arresto immediato e deciso
      const easeProgress = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
      
      const newZ = this.currentZ + (this.targetZ - this.currentZ) * easeProgress;
      this.el.object3D.position.z = newZ;

      if (progress >= 1) {
        this.isMoving = false;
        this.currentZ = this.targetZ;
        this.pauseTimer = 0;
        this.pauseDuration = this.getRandomPause();
      }
    } else {
      this.pauseTimer += dt;
      
      if (this.pauseTimer >= this.pauseDuration) {
        this.targetZ = this.getRandomTargetZ();
        this.isMoving = true;
        this.moveTimer = 0;
      }
    }
  }
});   


// 2. PALPEBRA: Movimento di battito / scorrimento
AFRAME.registerComponent('eyelid-blink', {
  schema: {
    openDuration: { type: 'number', default: 1200 },  // Tempo di apertura lenta (1.2s)
    holdOpen: { type: 'number', default: 2000 },      // Tempo in cui l'occhio RESTA APERTO (2s)
    closeDuration: { type: 'number', default: 1000 }, // Tempo di chiusura lenta (1s)
    minPause: { type: 'number', default: 7000 },     // Tempo minimo con OCCHIO CHIUSO (7s)
    maxPause: { type: 'number', default: 14000 },    // Tempo massimo con OCCHIO CHIUSO (14s)
    blinkDistanceX: { type: 'number', default: 0.15 } // Spostamento su X (metri) per mostrare l'occhio
  },

  init: function () {
    this.baseX = this.el.object3D.position.x;
    // Parte dalla posizione CHIUSA (traslata su X)
    this.el.object3D.position.x = this.baseX + this.data.blinkDistanceX;
    
    this.state = 'CLOSED'; // Stati: CLOSED, OPENING, HOLD_OPEN, CLOSING
    this.timer = 0;
    this.pauseDuration = this.getRandomPause();
  },

  getRandomPause: function () {
    return Math.random() * (this.data.maxPause - this.data.minPause) + this.data.minPause;
  },

  tick: function (t, dt) {
    if (!dt) return;

    switch (this.state) {
      case 'CLOSED':
        // L'occhio rimane CHIUSO per la maggior parte del tempo
        this.timer += dt;
        if (this.timer >= this.pauseDuration) {
          this.state = 'OPENING';
          this.timer = 0;
        }
        break;

      case 'OPENING':
        // Apertura lenta: la palpebra si sposta per svelare l'iride sotto
        this.timer += dt;
        const openProgress = Math.min(this.timer / this.data.openDuration, 1);
        const easeOpen = 0.5 - Math.cos(openProgress * Math.PI) / 2;
        
        this.el.object3D.position.x = (this.baseX + this.data.blinkDistanceX) - (this.data.blinkDistanceX * easeOpen);

        if (openProgress >= 1) {
          this.state = 'HOLD_OPEN';
          this.timer = 0;
        }
        break;

      case 'HOLD_OPEN':
        // Breve intervallo in cui l'occhio guarda in giro
        this.timer += dt;
        if (this.timer >= this.data.holdOpen) {
          this.state = 'CLOSING';
          this.timer = 0;
        }
        break;

      case 'CLOSING':
        // Chiusura graduale tornando alla posizione coperta
        this.timer += dt;
        const closeProgress = Math.min(this.timer / this.data.closeDuration, 1);
        const easeClose = 0.5 - Math.cos(closeProgress * Math.PI) / 2;

        this.el.object3D.position.x = this.baseX + (this.data.blinkDistanceX * easeClose);

        if (closeProgress >= 1) {
          this.el.object3D.position.x = this.baseX + this.data.blinkDistanceX;
          this.state = 'CLOSED';
          this.timer = 0;
          this.pauseDuration = this.getRandomPause();
        }
        break;
    }
  }
});
    // FINE MOVIMENTO OCCHI MOSTRO
    
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* Rimuove lo spinner e la schermata azzurra di caricamento di MindAR */
    .mindar-ui-loading, 
    div[class*="mindar-ui-loading"] {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* Forza la trasparenza su tutti gli elementi overlay e contenitori MindAR per evitare il fondo azzurro */
    .mindar-ui-overlay, 
    div[class*="mindar-ui"] {
      background: transparent !important;
      background-color: transparent !important;
    }
