<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove - Setup Tracciamento e Scatole 3D</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // 1. SMOOTH TRACKER (Interpolazione fluida per eliminare scatti)
    AFRAME.registerComponent('smooth-tracker', {
      schema: { factor: { type: 'number', default: 0.35 } },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;
        const object3D = this.el.object3D;
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }
        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });

    // 2. OPT-PLANE (Effetto Carta / Pareti Scatola)
    AFRAME.registerComponent('opt-plane', {
      init: function () {
        this.el.setAttribute('material', { 
          shader: 'standard',
          color: '#fcfaf2',      // Bianco avorio/carta
          roughness: 0.8,        // Superficie opaca
          metalness: 0.0,        // Zero riflessi
          transparent: true,
          alphaTest: 0.01,
          depthWrite: false,     // Previene buchi visivi
          side: 'double'         // Visibile da entrambi i lati
        });
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
    .mindar-ui-loading, div[class*="mindar-ui"] { display: none !important; }

    /* PANNELLO EDITOR DOCK SULLA DESTRA */
    #editor-ui {
      position: fixed;
      top: 12px;
      right: 12px;
      left: auto;
      bottom: auto;
      z-index: 999999;
      background: rgba(18, 18, 22, 0.92);
      color: #e1e1e1;
      padding: 12px;
      border-radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      width: 290px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
    }
    #editor-ui.collapsed #editor-body { display: none; }
    #editor-ui header {
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #3897f0;
      letter-spacing: 0.5px;
    }
    #editor-ui header button {
      background: #2c2c2e; color: #aaa; border: 1px solid #444; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 10px;
    }
    #editor-body { margin-top: 8px; }
    .section-title { font-weight: bold; color: #3897f0; margin: 8px 0 4px 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
    #editor-ui select, #editor-ui input, #editor-ui button {
      background: #252528; color: #fff; border: 1px solid #3a3a3c; padding: 4px; border-radius: 4px; font-size: 10px;
    }
    #editor-ui select { width: 100%; margin-bottom: 6px; }
    .ui-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .ui-row label { width: 36px; font-weight: bold; color: #8e8e93; }
    .ui-row input[type="number"] { width: 55px; text-align: right; }
    .ui-row input[type="range"] { flex: 1; accent-color: #3897f0; }
    .btn-group { display: flex; gap: 6px; margin-top: 8px; }
    .btn-group button { flex: 1; cursor: pointer; background: #007aff; border: none; font-weight: 600; color: #fff; padding: 6px; border-radius: 4px; }
    #export-output {
      display: none; width: 100%; height: 100px; margin-top: 6px; background: #0d0d0e; color: #34c759; font-family: monospace; font-size: 9px; resize: vertical; box-sizing: border-box;
    }
  </style>
</head>

<body>

  <div id="editor-ui">
    <header>
      <span>AR BOX & LAYER EDITOR</span>
      <button id="btn-toggle">Nascondi</button>
    </header>

    <div id="editor-body">
      <label for="plane-select" style="display:block; margin-bottom: 2px; color: #8e8e93;">Seleziona Elemento:</label>
      <select id="plane-select"></select>

      <div class="section-title">POSIZIONE (X, Y, Z)</div>
      <div class="ui-row">
        <label>X</label>
        <input type="number" id="posX-num" step="0.005">
        <input type="range" id="posX-range" min="-1" max="1" step="0.005">
      </div>
      <div class="ui-row">
        <label>Y</label>
        <input type="number" id="posY-num" step="0.005">
        <input type="range" id="posY-range" min="-1" max="1" step="0.005">
      </div>
      <div class="ui-row">
        <label>Z</label>
        <input type="number" id="posZ-num" step="0.001">
        <input type="range" id="posZ-range" min="-0.1" max="0.5" step="0.001">
      </div>

      <div class="section-title">ROTAZIONE (RotX, RotY, RotZ)</div>
      <div class="ui-row">
        <label>RotX</label>
        <input type="number" id="rotX-num" step="1">
        <input type="range" id="rotX-range" min="-180" max="180" step="1">
      </div>
      <div class="ui-row">
        <label>RotY</label>
        <input type="number" id="rotY-num" step="1">
        <input type="range" id="rotY-range" min="-180" max="180" step="1">
      </div>
      <div class="ui-row">
        <label>RotZ (Inclinazione)</label>
        <input type="number" id="rotZ-num" step="1">
        <input type="range" id="rotZ-range" min="-180" max="180" step="1">
      </div>

      <div class="btn-group">
        <button id="btn-refresh" style="background: #3a3a3c;">Aggiorna</button>
        <button id="btn-export">Genera HTML</button>
      </div>
      <textarea id="export-output" readonly></textarea>
    </div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5; autoStart: true; uiLoading: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;" 
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

<!-- ASSETS PRELOAD -->
    <a-assets>
      <!-- Layer 1 -->
      <img id="layer1" src="./ima/layer1.png">
      <img id="obj-1" src="./ima/obj-1.png">
      <img id="layer1-top" src="./ima/layer1-top.png">
      <img id="layer1-bottom" src="./ima/layer1-bottom.png">

      <!-- Layer 2 -->
      <img id="layer2" src="./ima/layer2.png">
      <img id="obj-2" src="./ima/obj-2.png">
      <img id="layer2-top" src="./ima/layer2-top.png">
      <img id="layer2-bottom" src="./ima/layer2-bottom.png">

      <!-- Layer 3 -->
      <img id="layer3" src="./ima/layer3.png">
      <img id="obj-3" src="./ima/obj-3.png">
      <img id="layer3-top" src="./ima/layer3-top.png">
      <img id="layer3-bottom" src="./ima/layer3-bottom.png">

      <!-- Layer 4 -->
      <img id="layer4" src="./ima/layer4.png">
      <img id="obj-4" src="./ima/obj-4.png">
      <img id="layer4-top" src="./ima/layer4-top.png">
      <img id="layer4-bottom" src="./ima/layer4-bottom.png">

      <!-- Layer 5 -->
      <img id="layer5" src="./ima/layer5.png">
      <img id="obj-5" src="./ima/obj-5.png">
      <img id="layer5-top" src="./ima/layer5-top.png">
      <img id="layer5-bottom" src="./ima/layer5-bottom.png">

      <!-- Layer 6 -->
      <img id="layer6" src="./ima/layer6.png">
      <img id="obj-6" src="./ima/obj-6.png">
      <img id="layer6-top" src="./ima/layer6-top.png">
      <img id="layer6-bottom" src="./ima/layer6-bottom.png">

      <!-- Layer 7 -->
      <img id="layer7" src="./ima/layer7.png">
      <img id="layer7-top" src="./ima/layer7-top.png">
      <img id="layer7-bottom" src="./ima/layer7-bottom.png">

      <!-- Elementi Extra -->
      <img id="omino" src="./ima/omino.png">
    </a-assets>

    <!-- LUCI -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.1;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.4" position="1 2 1"></a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

<!-- TRACCIAMENTO TARGET (ORDINATO PER Z CRESCENTE) -->
    <a-entity mindar-image-target="targetIndex: 0" smooth-tracker="factor: 0.35">
      
      <!-- ================= 1. Z = 0.013 ================= -->
      <a-entity id="layer5-top" class="editable" position="0.000 0.200 0.013" rotation="0 0 -2">
        <a-plane opt-plane material="alphaTest: 0.5" src="#layer5-top" position="0 0 0" rotation="90 0 0" width="1" height="0.025"></a-plane>
      </a-entity>

      <a-entity id="layer5-bottom" class="editable" position="0.000 0.090 0.013" rotation="0 0 -2">
        <a-plane opt-plane material="alphaTest: 0.5" src="#layer5-bottom" position="0 0 0" rotation="-90 0 0" width="1" height="0.025"></a-plane>
      </a-entity>

      <!-- ================= 2. Z = 0.020 ================= -->
      <a-entity id="layer4-top" class="editable" position="0.000 0.068 0.020" rotation="0 0 -2">
        <a-plane opt-plane material="alphaTest: 0.5" src="#layer4-top" position="0 0 0" rotation="90 0 0" width="1" height="0.040"></a-plane>
      </a-entity>

      <a-entity id="layer4-bottom" class="editable" position="0.000 -0.020 0.020" rotation="0 0 -2">
        <a-plane opt-plane material="alphaTest: 0.5" src="#layer4-bottom" position="0 0 0" rotation="-90 0 0" width="1" height="0.040"></a-plane>
      </a-entity>

      <!-- ================= 3. Z = 0.025 ================= -->
      <a-plane id="plane-layer5" class="editable" opt-plane src="#layer5" position="0.000 0.000 0.025" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- ================= 4. Z = 0.032 ================= -->
      <a-plane id="plane-obj5" class="editable" opt-plane src="#obj-5" position="0.000 0.000 0.032" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- ================= 5. Z = 0.040 ================= -->
      <a-plane id="plane-layer4" class="editable" opt-plane src="#layer4" position="0.000 0.000 0.040" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- ================= 6. Z = 0.042 ================= -->
      <a-plane id="plane-obj4" class="editable" opt-plane src="#obj-4" position="0.000 0.000 0.042" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- ================= 7. Z = 0.050 ================= -->
      <a-entity id="layer7-top" class="editable" position="0.000 0.410 0.050" rotation="0 0 3">
        <a-plane opt-plane material="alphaTest: 0.5" src="#layer7-top" position="0 0 0" rotation="90 0 0" width="1" height="0.100"></a-plane>
      </a-entity>

      <a-entity id="layer7-bottom" class="editable" position="0.000 0.285 0.050" rotation="0 0 3">
        <a-plane opt-plane material="alphaTest: 0.5" src="#layer7-bottom" position="0 0 0" rotation="-90 0 0" width="1" height="0.100"></a-plane>
      </a-entity>

      <!-- ================= 8. Z = 0.080 ================= -->
      <a-plane id="plane-omino" class="editable" opt-plane src="#omino" position="0.000 0.000 0.080" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- ================= 9. Z = 0.100 ================= -->
      <a-entity id="layer6-top" class="editable" position="0.000 0.265 0.100" rotation="0 0 -1">
        <a-plane opt-plane material="alphaTest: 0.5" src="#layer6-top" position="0 0 0" rotation="90 0 0" width="1" height="0.200"></a-plane>
      </a-entity>

      <a-entity id="layer6-bottom" class="editable" position="0.000 0.210 0.100" rotation="0 0 -2">
        <a-plane opt-plane material="alphaTest: 0.5" src="#layer6-bottom" position="0 0 0" rotation="-90 0 0" width="1" height="0.200"></a-plane>
      </a-entity>

      <a-entity id="layer2-top" class="editable" position="0.000 -0.165 0.100" rotation="0 0 0">
        <a-plane opt-plane material="alphaTest: 0.5" src="#layer2-top" position="0 0 0" rotation="90 0 0" width="1" height="0.200"></a-plane>
      </a-entity>

      <a-entity id="layer2-bottom" class="editable" position="0.000 -0,265 0.100" rotation="0 0 0">
        <a-plane opt-plane material="alphaTest: 0.5" src="#layer2-bottom" position="0 0 0" rotation="-90 0 0" width="1" height="0.200"></a-plane>
      </a-entity>

      <a-plane id="plane-layer7" class="editable" opt-plane src="#layer7" position="0.000 0.000 0.100" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- ================= 10. Z = 0.150 / 0.160 ================= -->
      <a-entity id="layer1-top" class="editable" position="0.000 -0.290 0.150" rotation="0 0 0">
        <a-plane opt-plane material="alphaTest: 0.5" src="#layer1-top" position="0 0 0" rotation="90 0 0" width="1" height="0.300"></a-plane>
      </a-entity>

      <a-entity id="layer1-bottom" class="editable" position="0.000 -0.340 0.160" rotation="0 0 0">
        <a-plane opt-plane material="alphaTest: 0.5" src="#layer1-bottom" position="0 0 0" rotation="-90 0 0" width="1" height="0.300"></a-plane>
      </a-entity>

      <!-- ================= 11. Z = 0.177 ================= -->
      <a-entity id="layer3-top" class="editable" position="0.035 -0.015 0.177" rotation="0 0 9">
        <a-plane opt-plane material="alphaTest: 0.5" src="#layer3-top" position="0 0 0" rotation="90 0 0" width="1" height="0.100"></a-plane>
      </a-entity>

      <a-entity id="layer3-bottom" class="editable" position="0.035 -0.115 0.177" rotation="0 0 9">
        <a-plane opt-plane material="alphaTest: 0.5" src="#layer3-bottom" position="0 0 0" rotation="-90 0 0" width="1" height="0.100"></a-plane>
      </a-entity>

      <!-- ================= 12. Z = 0.179 ================= -->
      <a-plane id="plane-layer6" class="editable" opt-plane src="#layer6" position="0.000 0.000 0.179" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- ================= 13. Z = 0.184 / 0.186 ================= -->
      <a-plane id="plane-layer3" class="editable" opt-plane src="#layer3" position="0.000 0.000 0.184" rotation="0 0 0" width="1" height="1"></a-plane>
      <a-plane id="plane-obj3" class="editable" opt-plane src="#obj-3" position="0.000 0.000 0.186" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- ================= 14. Z = 0.200 / 0.205 ================= -->
      <a-plane id="plane-layer2" class="editable" opt-plane src="#layer2" position="0.000 0.000 0.200" rotation="0 0 0" width="1" height="1"></a-plane>
      <a-plane id="plane-obj6" class="editable" opt-plane src="#obj-6" position="0.000 0.000 0.205" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- ================= 15. Z = 0.220 ================= -->
      <a-plane id="plane-obj2" class="editable" opt-plane src="#obj-2" position="0.000 0.000 0.220" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- ================= 16. Z = 0.300 ================= -->
      <a-plane id="plane-layer1" class="editable" opt-plane src="#layer1" position="0.000 0.000 0.300" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- ================= 17. Z = 0.320 ================= -->
      <a-plane id="plane-obj1" class="editable" opt-plane src="#obj-1" position="0.000 0.000 0.320" rotation="0 0 0" width="1" height="1"></a-plane>

    </a-entity>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('plane-select');
      
      const posXNum = document.getElementById('posX-num');
      const posXRange = document.getElementById('posX-range');
      const posYNum = document.getElementById('posY-num');
      const posYRange = document.getElementById('posY-range');
      const posZNum = document.getElementById('posZ-num');
      const posZRange = document.getElementById('posZ-range');

      const rotXNum = document.getElementById('rotX-num');
      const rotXRange = document.getElementById('rotX-range');
      const rotYNum = document.getElementById('rotY-num');
      const rotYRange = document.getElementById('rotY-range');
      const rotZNum = document.getElementById('rotZ-num');
      const rotZRange = document.getElementById('rotZ-range');

      const btnExport = document.getElementById('btn-export');
      const btnRefresh = document.getElementById('btn-refresh');
      const btnToggle = document.getElementById('btn-toggle');
      const editorUI = document.getElementById('editor-ui');
      const exportOutput = document.getElementById('export-output');

      let elements = [];
      let selectedElement = null;

      function scanElements() {
        // Seleziona sia i wrapper genitore (.editable a-entity) che i singoli piani (.editable a-plane)
        elements = Array.from(document.querySelectorAll('.editable'));
        select.innerHTML = '';
        
        elements.forEach((el, index) => {
          const idAttr = el.id ? `#${el.id}` : `elem-${index + 1}`;
          const tagType = el.tagName.toLowerCase() === 'a-entity' ? '[WRAPPER]' : '[PLANE]';
          const label = `${idAttr} ${tagType}`;
          
          const option = document.createElement('option');
          option.value = index;
          option.textContent = label;
          select.appendChild(option);
        });

        if (elements.length > 0) selectElement(0);
      }

      function selectElement(index) {
        selectedElement = elements[index];
        if (!selectedElement) return;
        
        const pos = selectedElement.getAttribute('position') || { x: 0, y: 0, z: 0 };
        const rot = selectedElement.getAttribute('rotation') || { x: 0, y: 0, z: 0 };

        updateUIValues(pos, rot);
      }

      function updateUIValues(pos, rot) {
        posXNum.value = Number(pos.x).toFixed(3); posXRange.value = pos.x;
        posYNum.value = Number(pos.y).toFixed(3); posYRange.value = pos.y;
        posZNum.value = Number(pos.z).toFixed(3); posZRange.value = pos.z;

        rotXNum.value = Math.round(rot.x); rotXRange.value = rot.x;
        rotYNum.value = Math.round(rot.y); rotYRange.value = rot.y;
        rotZNum.value = Math.round(rot.z); rotZRange.value = rot.z;
      }

      function applyTransform() {
        if (!selectedElement) return;
        const px = parseFloat(posXNum.value) || 0;
        const py = parseFloat(posYNum.value) || 0;
        const pz = parseFloat(posZNum.value) || 0;

        const rx = parseFloat(rotXNum.value) || 0;
        const ry = parseFloat(rotYNum.value) || 0;
        const rz = parseFloat(rotZNum.value) || 0;

        selectedElement.setAttribute('position', `${px} ${py} ${pz}`);
        selectedElement.setAttribute('rotation', `${rx} ${ry} ${rz}`);
      }

      function bindControl(numEl, rangeEl) {
        numEl.addEventListener('input', () => { rangeEl.value = numEl.value; applyTransform(); });
        rangeEl.addEventListener('input', () => { numEl.value = rangeEl.value; applyTransform(); });
      }

      bindControl(posXNum, posXRange);
      bindControl(posYNum, posYRange);
      bindControl(posZNum, posZRange);

      bindControl(rotXNum, rotXRange);
      bindControl(rotYNum, rotYRange);
      bindControl(rotZNum, rotZRange);

      select.addEventListener('change', (e) => selectElement(e.target.value));
      btnRefresh.addEventListener('click', scanElements);

      btnToggle.addEventListener('click', () => {
        editorUI.classList.toggle('collapsed');
        btnToggle.textContent = editorUI.classList.contains('collapsed') ? 'Mostra' : 'Nascondi';
      });

      btnExport.addEventListener('click', () => {
        let outputHTML = '';
        elements.forEach(el => {
          const id = el.id ? `id="${el.id}" ` : '';
          const pos = el.getAttribute('position');
          const rot = el.getAttribute('rotation') || { x: 0, y: 0, z: 0 };

          const posX = Number(pos.x).toFixed(3);
          const posY = Number(pos.y).toFixed(3);
          const posZ = Number(pos.z).toFixed(3);

          const rotX = Math.round(rot.x);
          const rotY = Math.round(rot.y);
          const rotZ = Math.round(rot.z);

          if (el.tagName.toLowerCase() === 'a-entity') {
            const childPlane = el.querySelector('a-plane');
            const innerRot = childPlane.getAttribute('rotation') || { x: 90, y: 0, z: 0 };
            const innerRotStr = `${innerRot.x} ${innerRot.y} ${innerRot.z}`;
            const w = childPlane.getAttribute('width') || '1';
            const h = childPlane.getAttribute('height') || '1';

            outputHTML += `<a-entity ${id}position="${posX} ${posY} ${posZ}" rotation="${rotX} ${rotY} ${rotZ}">\n`;
            outputHTML += `  <a-plane opt-plane position="0 0 0" rotation="${innerRotStr}" width="${w}" height="${h}"></a-plane>\n`;
            outputHTML += `</a-entity>\n`;
          } else {
            const src = el.getAttribute('src') ? `src="${el.getAttribute('src')}" ` : '';
            const w = el.getAttribute('width') || '1';
            const h = el.getAttribute('height') || '1';

            outputHTML += `<a-plane ${id}opt-plane ${src}position="${posX} ${posY} ${posZ}" rotation="${rotX} ${rotY} ${rotZ}" width="${w}" height="${h}"></a-plane>\n`;
          }
        });

        exportOutput.value = outputHTML;
        exportOutput.style.display = 'block';
        exportOutput.select();
      });

      const scene = document.querySelector('a-scene');
      if (scene.hasLoaded) scanElements();
      else scene.addEventListener('loaded', scanElements);
    });
  </script>
</body>
</html>
