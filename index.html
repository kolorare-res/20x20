<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mostra AR - Poetica della Pagina</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- File di configurazione -->
  <script src="./config.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- STABILIZZAZIONE ATTIVA: filterMinCF e filterBeta per evitare tremolii -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 10;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Contenitore dell'opera riconosciuta -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");

      // Calcolo dello spazio tra i livelli
      const stepDepth = config.layers > 1 ? (config.maxDepth / (config.layers - 1)) : 0;

      for (let i = 1; i <= config.layers; i++) {
        const layerNumber = String(i).padStart(2, '0');
        const imagePath = `./images/layer${layerNumber}.png`;

        // Avanzamento Z in avanti verso la fotocamera (effetto Pop-up)
        const targetZ = (i - 1) * stepDepth;

        // Usiamo a-box anziché a-plane per dare sostanza e spessore (2 mm)
        const box = document.createElement("a-box");
        box.setAttribute("src", imagePath);
        
        box.setAttribute("width", "1");
        box.setAttribute("height", "1");
        box.setAttribute("depth", "0.002"); // Spessore foglio (2 mm)
        
        box.setAttribute("position", "0 0 0");
        box.setAttribute("rotation", "0 0 0");
        
        box.setAttribute("material", "transparent: true; alphaTest: 0.5; side: double;");

        if (i > 1) {
          box.setAttribute("animation", {
            property: "position",
            from: "0 0 0",
            to: `0 0 ${targetZ.toFixed(4)}`,
            dur: config.openDuration,
            easing: config.easing,
            fill: "forwards"
          });
        }

        targetEntity.appendChild(box);
      }
    });
  </script>

</body>
</html>
