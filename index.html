<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove - AR Scene</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // 1. SMOOTH TRACKER
    AFRAME.registerComponent('smooth-tracker', {
      schema: { factor: { type: 'number', default: 0.35 } },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;
        const object3D = this.el.object3D;
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }
        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });

    // 2. OPT-PLANE
    AFRAME.registerComponent('opt-plane', {
      init: function () {
        this.el.setAttribute('material', { 
          shader: 'standard',
          color: '#fcfaf2',
          roughness: 0.8,
          metalness: 0.0,
          transparent: true,
          alphaTest: 0.01,
          depthWrite: false,
          side: 'double'
        });
      }
    });

    // 3. RENDER-ORDER
    AFRAME.registerComponent('render-order', {
      schema: { type: 'number', default: 0 },
      init: function () {
        this.applyOrder = this.applyOrder.bind(this);
        this.el.addEventListener('object3dset', this.applyOrder);
        this.applyOrder();
      },
      update: function () {
        this.applyOrder();
      },
      applyOrder: function () {
        const order = this.data;
        if (this.el.object3D) {
          this.el.object3D.renderOrder = order;
          this.el.object3D.traverse((node) => {
            node.renderOrder = order;
          });
        }
      }
    });

    // 4. 3D-BOX COMPONENT (Ancorato alla faccia frontale)
    AFRAME.registerComponent('3d-box', {
      schema: {
        width: { type: 'number', default: 1 },
        height: { type: 'number', default: 1 },
        depth: { type: 'number', default: 0.05 },
        src: { type: 'selector' },
        srcTop: { type: 'selector' },
        srcBottom: { type: 'selector' },
        srcLeft: { type: 'selector' },
        srcRight: { type: 'selector' }
      },
      init: function () {
        const el = this.el;
        const data = this.data;
        const loader = new THREE.TextureLoader();

        const createMat = (selector) => {
          if (!selector) {
            return new THREE.MeshStandardMaterial({ color: '#fcfaf2', roughness: 0.8 });
          }
          const texture = loader.load(selector.src);
          texture.encoding = THREE.sRGBEncoding;
          return new THREE.MeshStandardMaterial({ 
            map: texture, 
            transparent: true, 
            alphaTest: 0.1, 
            roughness: 0.8 
          });
        };

        const geometry = new THREE.BoxGeometry(data.width, data.height, data.depth);
        geometry.translate(0, 0, -data.depth / 2);

        const materials = [
          createMat(data.srcRight),
          createMat(data.srcLeft),
          createMat(data.srcTop),
          createMat(data.srcBottom),
          createMat(data.src),
          createMat(data.src)
        ];

        const mesh = new THREE.Mesh(geometry, materials);
        el.setObject3D('mesh', mesh);
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
    .mindar-ui-loading, div[class*="mindar-ui"] { display: none !important; }
  </style>
</head>

<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5; autoStart: true; uiLoading: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;" 
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- ASSETS PRELOAD -->
    <a-assets>
      <!-- Layer 0 -->
      <img id="layer0" src="./image/layer0.png">

      <!-- Layer 1 -->
      <img id="layer1" src="./image/layer1.png">
      <img id="obj-1" src="./image/obj-1.png">
      <img id="layer1-top" src="./image/layer1-top.png">
      <img id="layer1-bottom" src="./image/layer1-bottom.png">

      <!-- Layer 2 -->
      <img id="layer2" src="./image/layer2.png">
      <img id="obj-2" src="./image/obj-2.png">
      <img id="layer2-top" src="./image/layer2-top.png">
      <img id="layer2-bottom" src="./image/layer2-bottom.png">
      <img id="layer2-left" src="./image/layer2-left.png">
      <img id="layer2-right" src="./image/layer2-right.png">

      <!-- Layer 3 -->
      <img id="layer3" src="./image/layer3.png">
      <img id="obj-3" src="./image/obj-3.png">
      <img id="layer3-top" src="./image/layer3-top.png">
      <img id="layer3-bottom" src="./image/layer3-bottom.png">

      <!-- Layer 4 -->
      <img id="layer4" src="./image/layer4.png">
      <img id="obj-4" src="./image/obj-4.png">
      <img id="layer4-top" src="./image/layer4-top.png">
      <img id="layer4-bottom" src="./image/layer4-bottom.png">

      <!-- Layer 5 -->
      <img id="layer5" src="./image/layer5.png">
      <img id="obj-5" src="./image/obj-5.png">
      <img id="obj-5" src="./image/obj-5-boat.png">
      <img id="layer5-top" src="./image/layer5-top.png">
      <img id="layer5-bottom" src="./image/layer5-bottom.png">
      <img id="layer5-left" src="./image/layer5-left.png">
      <img id="layer5-right" src="./image/layer5-right.png">

      <!-- Layer 6 -->
      <img id="layer6" src="./image/layer6.png">
      <img id="obj-6" src="./image/obj-6.png">
      <img id="layer6-top" src="./image/layer6-top.png">
      <img id="layer6-bottom" src="./image/layer6-bottom.png">

      <!-- Layer 7 -->
      <img id="layer7" src="./image/layer7.png">
      <img id="layer7-top" src="./image/layer7-top.png">
      <img id="layer7-bottom" src="./image/layer7-bottom.png">

      <!-- Elementi Extra -->
      <img id="omino" src="./image/omino.png">
    </a-assets>

    <!-- LUCI -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.1;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.4" position="1 2 1"></a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- TRACCIAMENTO TARGET -->
    <a-entity mindar-image-target="targetIndex: 0" smooth-tracker="factor: 0.35">
      
      <!-- 0. Layer 0 Sfondo -->
      <a-plane id="plane-layer0" opt-plane src="#layer0" position="0.000 0.000 0.005" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- 1. SCATOLA LAYER 5 (Barca) -->
      <a-entity 
        id="box-layer5" 
        3d-box="
          src: #layer5; 
          srcTop: #layer5-top; 
          srcBottom: #layer5-bottom; 
          srcLeft: #layer5-left; 
          srcRight: #layer5-right;
          width: 0.5705; 
          height: 0.1240; 
          depth: 0.025;" 
        position="0.000 0.130 0.025" 
        rotation="0 0 357">
      </a-entity>

      <!-- Oggetto 5 -->
      <a-plane id="plane-obj5" opt-plane src="#obj-5" position="0.000 0.000 0.032" rotation="0 0 0" width="1" height="1"></a-plane>
      <a-plane id="plane-obj5-boat" opt-plane src="#obj-5-boat" position="0.000 0.000 0.031" rotation="0 0 0" width="1" height="1"></a-plane>


      <!-- 2. SCATOLA LAYER 4 (Pesce) -->
      <a-entity 
        id="box-layer4" 
        3d-box="
          src: #layer4; 
          srcTop: #layer4-top; 
          srcBottom: #layer4-bottom; 
          width: 0.5955; 
          height: 0.0880; 
          depth: 0.040;" 
        position="0.000 0.020 0.040" 
        rotation="0 -6 358">
      </a-entity>

      <!-- Oggetto 4 -->
      <a-plane id="plane-obj4" opt-plane src="#obj-4" position="0.020 -0.025 0.046" rotation="0 -4 0" width="1" height="1"></a-plane>

      <!-- Elemento Omino Sfondo -->
      <a-plane id="plane-omino" opt-plane src="#omino" position="0.000 0.000 0.080" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- 3. SCATOLA LAYER 7 (Omino Box) -->
      <a-entity 
        id="box-layer7" 
        3d-box="
          src: #layer7; 
          srcTop: #layer7-top; 
          srcBottom: #layer7-bottom; 
          width: 0.6260; 
          height: 0.1300; 
          depth: 0.100;" 
        position="0.000 0.350 0.100" 
        rotation="0 0 3">
      </a-entity>

      <!-- 4. SCATOLA LAYER 6 (Case) -->
      <a-entity 
        id="box-layer6" 
        3d-box="
          src: #layer6; 
          srcTop: #layer6-top; 
          srcBottom: #layer6-bottom; 
          width: 0.5590; 
          height: 0.0615; 
          depth: 0.179;" 
        position="0.000 0.240 0.179" 
        rotation="0 15 358">
      </a-entity>

      <!-- 5. SCATOLA LAYER 3 (Lampione) -->
      <a-entity 
        id="box-layer3" 
        3d-box="
          src: #layer3; 
          srcTop: #layer3-top; 
          srcBottom: #layer3-bottom; 
          width: 0.6180; 
          height: 0.1105; 
          depth: 0.184;" 
        position="0.000 -0.090 0.184" 
        rotation="0 0 189">
      </a-entity>

      <!-- Oggetto 3 -->
      <a-plane id="plane-obj3" opt-plane src="#obj-3" position="0.000 0.000 0.186" rotation="0 0 0" width="1" height="1"></a-plane>

      <!-- 6. SCATOLA LAYER 2 (Fiori) -->
      <a-entity 
        id="box-layer2" 
        3d-box="
          src: #layer2; 
          srcTop: #layer2-top; 
          srcBottom: #layer2-bottom; 
          srcLeft: #layer2-left; 
          srcRight: #layer2-right;
          width: 0.5700; 
          height: 0.1185; 
          depth: 0.200;" 
        position="0.000 -0.210 0.200" 
        rotation="0 16 0">
      </a-entity>

      <!-- Oggetti 6 e 2 -->
      <a-plane id="plane-obj6" opt-plane src="#obj-6" position="0.050 0.000 0.183" rotation="0 15 0" width="1" height="1"></a-plane>
      <a-plane id="plane-obj2" opt-plane src="#obj-2" position="0.000 0.000 0.220" rotation="0 16 0" width="1" height="1"></a-plane>

      <!-- 7. SCATOLA LAYER 1 (Box Principale) -->
      <a-entity 
        id="box-layer1"
        3d-box="
          src: #layer1; 
          srcTop: #layer1-top; 
          srcBottom: #layer1-bottom; 
          width: 0.616; 
          height: 0.052; 
          depth: 0.300;" 
        position="0.000 -0.325 0.300" 
        rotation="0 0 0">
      </a-entity>

      <!-- Oggetto 1 -->
      <a-plane id="plane-obj1" opt-plane src="#obj-1" position="-0.025 -0.015 0.320" rotation="0 0 0" width="1" height="1"></a-plane>

    </a-entity>
  </a-scene>

</body>
</html>
