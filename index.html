<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // Componente Smooth Tracker
    AFRAME.registerComponent('smooth-tracker', {
      schema: { factor: { type: 'number', default: 0.35 } },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;
        const object3D = this.el.object3D;
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }
        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });
    // Movimento occhi mostro
// 1. IRIDE: Movimento biologico iper-scattante (saccadi reali)
AFRAME.registerComponent('eye-movement', {
  schema: {
    rangeZ: { type: 'number', default: 0.0065 },    // Escursione di 1.3 cm totali (±0.65 cm dal centro)
    minPause: { type: 'number', default: 400 },      // Pausa minima tra le occhiate (0.4s)
    maxPause: { type: 'number', default: 1800 },     // Pausa massima tra le occhiate (1.8s)
    moveDuration: { type: 'number', default: 90 }    // Scatto ultra-rapido (90 ms per un effetto fulmineo)
  },

  init: function () {
    this.baseZ = this.el.object3D.position.z;
    this.currentZ = this.baseZ;
    this.targetZ = this.baseZ;
    
    this.isMoving = false;
    this.moveTimer = 0;
    this.pauseTimer = 0;
    this.pauseDuration = this.getRandomPause();
  },

  getRandomPause: function () {
    return Math.random() * (this.data.maxPause - this.data.minPause) + this.data.minPause;
  },

  getRandomTargetZ: function () {
    const randomOffset = (Math.random() * 2 - 1) * this.data.rangeZ;
    return this.baseZ + randomOffset;
  },

  tick: function (t, dt) {
    if (!dt) return;

    if (this.isMoving) {
      this.moveTimer += dt;
      const progress = Math.min(this.moveTimer / this.data.moveDuration, 1);
      
      // Funzione di easing "Expo Out" per un arresto immediato e deciso
      const easeProgress = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
      
      const newZ = this.currentZ + (this.targetZ - this.currentZ) * easeProgress;
      this.el.object3D.position.z = newZ;

      if (progress >= 1) {
        this.isMoving = false;
        this.currentZ = this.targetZ;
        this.pauseTimer = 0;
        this.pauseDuration = this.getRandomPause();
      }
    } else {
      this.pauseTimer += dt;
      
      if (this.pauseTimer >= this.pauseDuration) {
        this.targetZ = this.getRandomTargetZ();
        this.isMoving = true;
        this.moveTimer = 0;
      }
    }
  }
});


// 2. PALPEBRA: Movimento di battito / scorrimento
AFRAME.registerComponent('eyelid-blink', {
  schema: {
    blinkDuration: { type: 'number', default: 160 }, // Durata della chiusura/riapertura (ms)
    minPause: { type: 'number', default: 2000 },     // Pausa min tra battiti (ms)
    maxPause: { type: 'number', default: 5500 },     // Pausa max tra battiti (ms)
    blinkDistance: { type: 'number', default: 0.06 } // Escursione lungo Z della palpebra (meters)
  },

  init: function () {
    this.baseZ = this.el.object3D.position.z;
    this.isBlinking = false;
    this.timer = 0;
    this.blinkTimer = 0;
    this.nextBlink = this.getRandomPause();
  },

  getRandomPause: function () {
    return Math.random() * (this.data.maxPause - this.data.minPause) + this.data.minPause;
  },

  tick: function (t, dt) {
    if (!dt) return;

    if (!this.isBlinking) {
      this.timer += dt;
      if (this.timer >= this.nextBlink) {
        this.isBlinking = true;
        this.timer = 0;
        this.blinkTimer = 0;
      }
    } else {
      this.blinkTimer += dt;
      const progress = this.blinkTimer / this.data.blinkDuration;

      if (progress <= 1) {
        // Avanza e torna indietro fluidamente con un'onda sinusoidale
        const offset = Math.sin(progress * Math.PI) * this.data.blinkDistance;
        this.el.object3D.position.z = this.baseZ + offset;
      } else {
        this.el.object3D.position.z = this.baseZ;
        this.isBlinking = false;
        this.nextBlink = this.getRandomPause();
      }
    }
  }
});
    
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* Rimuove lo spinner e la schermata azzurra di caricamento di MindAR */
    .mindar-ui-loading, 
    div[class*="mindar-ui-loading"] {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* Forza la trasparenza su tutti gli elementi overlay e contenitori MindAR per evitare il fondo azzurro */
    .mindar-ui-overlay, 
    div[class*="mindar-ui"] {
      background: transparent !important;
      background-color: transparent !important;
    }
  </style>
</head>

        rotation="-90 0 0" 
        width="1" 
        height="1" 
        material="transparent: true; alphaTest: 0.1; side: double;">
      </a-plane>

  src="#layer1-floor"

      <a-plane src="#layer6" position="0 0 0.50" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>
      <a-plane src="#layer7" position="0 0 0.70" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>

<a-plane src="#layer8" position="0 0 0.620" width="1" height="1" material="transparent: true; alphaTest: 0.1; side: double;"></a-plane>

<a-plane

<a-plane
