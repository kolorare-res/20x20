<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove</title>

  <!-- Librerie A-Frame 1.4.2 e MindAR 1.2.5 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- File di configurazione -->
  <script src="./config.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 10;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Contenitore dell'opera riconosciuta: Altrove -->
    <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#ar-target");
      const pageAngle = config.pageOpenAngle || 130;

      // ==========================================
      // FASE 1: PAGINE LATERALI POSIZIONATE GIÀ APERTE A CERNIERA
      // ==========================================
      const pagesData = [
        {
          id: "page-left",
          image: "./images/page_left.png",
          pivotPos: "-0.5 0 0.002",
          planeOffset: "0.5 0 0",
          rotation: `0 ${pageAngle} 0`
        },
        {
          id: "page-right",
          image: "./images/page_right.png",
          pivotPos: "0.5 0 0.002",
          planeOffset: "-0.5 0 0",
          rotation: `0 -${pageAngle} 0`
        },
        {
          id: "page-bottom",
          image: "./images/page_bottom.png",
          pivotPos: "0 -0.5 0.002",
          planeOffset: "0 0.5 0",
          rotation: `-${pageAngle} 0 0`
        }
      ];

      pagesData.forEach((p, index) => {
        const pivot = document.createElement("a-entity");
        pivot.setAttribute("id", p.id);
        pivot.setAttribute("position", p.pivotPos);
        pivot.setAttribute("rotation", p.rotation); // Impostata direttamente senza animazione!

        const plane = document.createElement("a-plane");
        plane.setAttribute("src", p.image);
        plane.setAttribute("width", "1");
        plane.setAttribute("height", "1");
        plane.setAttribute("position", p.planeOffset);
        plane.setAttribute("material", "transparent: true; alphaTest: 0.5; side: double; depthTest: true;");
        plane.setAttribute("render-order", 50 + index);

        pivot.appendChild(plane);
        targetEntity.appendChild(pivot);
      });

      // ==========================================
      // FASE 2: LAYER Z POSIZIONATI GIÀ IN PROFONDITÀ
      // ==========================================
      const stepDepth = config.layers > 1 ? (config.maxDepth / (config.layers - 1)) : 0;

      for (let i = 1; i <= config.layers; i++) {
        const layerNumber = String(i).padStart(2, '0');
        const plane = document.createElement("a-plane");
        plane.setAttribute("src", `./images/layer${layerNumber}.png`);
        plane.setAttribute("width", "1");
        plane.setAttribute("height", "1");

        const targetZ = (i - 1) * stepDepth;
        plane.setAttribute("position", `0 0 ${targetZ.toFixed(4)}`); // Posizionato direttamente!

        plane.setAttribute("material", "transparent: true; alphaTest: 0.5; side: front; depthTest: true;");
        plane.setAttribute("render-order", i);

        targetEntity.appendChild(plane);
      }
    });
  </script>

</body>
</html>
