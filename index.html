<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altrove - Setup Tracciamento</title>

  <!-- Librerie A-Frame e MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // 1. SMOOTH TRACKER (Interpolazione fluida per eliminare scatti)
    AFRAME.registerComponent('smooth-tracker', {
      schema: { factor: { type: 'number', default: 0.35 } },
      init: function () {
        this.hasTarget = false;
        this.el.addEventListener('targetFound', () => { this.hasTarget = true; });
        this.el.addEventListener('targetLost', () => { this.hasTarget = false; });
      },
      tick: function () {
        if (!this.hasTarget) return;
        const object3D = this.el.object3D;
        if (this.prevPos) {
          object3D.position.lerp(this.prevPos, 1 - this.data.factor);
          object3D.quaternion.slerp(this.prevQuat, 1 - this.data.factor);
        }
        this.prevPos = object3D.position.clone();
        this.prevQuat = object3D.quaternion.clone();
      }
    });

   // 2. OPT-PLANE (Effetto Carta)
AFRAME.registerComponent('opt-plane', {
  init: function () {
    this.el.setAttribute('material', { 
      shader: 'standard',
      color: '#fcfaf2',      // Bianco avorio/carta (evita il bianco ottico)
      roughness: 0.8,        // Rende la superficie opaca come la carta
      metalness: 0.0,        // Zero riflessi metallici
      transparent: true,
      alphaTest: 0.1,
      side: 'double'
    });
  }
});
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
    /* Nasconde la schermata di caricamento di default di MindAR */
    .mindar-ui-loading, div[class*="mindar-ui"] { display: none !important; }
  </style>
</head>

<body>
  <!-- IMPOSTAZIONI FOTOCAMERA E TRACCIAMENTO MINDAR -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5; autoStart: true; uiLoading: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;" 
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- ASSETS PRELOAD (Cartella /ima) -->
    <a-assets>
      <img id="layer1" src="./ima/layer1.png">
      <img id="layer2" src="./ima/layer2.png">
      <img id="layer3" src="./ima/layer3.png">
      <img id="layer4" src="./ima/layer4.png">
      <img id="layer5" src="./ima/layer5.png">
      <img id="layer6" src="./ima/layer6.png">
      <img id="layer7" src="./ima/layer7.png">
      <img id="omino" src="./ima/omino.png">

      <!-- oggetti -->
      <img id="obj-1" src="./ima/obj-1.png">
      <img id="obj-2" src="./ima/obj-2.png">
      <img id="obj-3" src="./ima/obj-3.png">
      <img id="obj-4" src="./ima/obj-4.png">
      <img id="obj-5" src="./ima/obj-5.png">
      <img id="obj-6" src="./ima/obj-6.png">

    </a-assets>

    <!-- FOTOCAMERA -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- ANCORAGGIO TARGET CON SMOOTH-TRACKER APPLICATO -->
    <a-entity mindar-image-target="targetIndex: 0" smooth-tracker="factor: 0.35">
      
      <!-- 7 LAYER PNG TRASPARENTI 20x20 (sovrapposti in ordine di profondità Z) -->
      <a-plane opt-plane src="#layer1" position="0 0 0.07" width="1" height="1"></a-plane>
      <a-plane opt-plane src="#obj-1" position="0 0 0.072" width="1" height="1"></a-plane>
      <a-plane opt-plane src="#layer2" position="0 0 0.06" width="1" height="1"></a-plane>
       <a-plane opt-plane src="#obj-2" position="0 0 0.062" width="1" height="1"></a-plane>
      <a-plane opt-plane src="#layer3" position="0 0 0.05" width="1" height="1"></a-plane>
       <a-plane opt-plane src="#obj-3" position="0 0 0.052" width="1" height="1"></a-plane>
      <a-plane opt-plane src="#layer4" position="0 0 0.04" width="1" height="1"></a-plane>
      <a-plane opt-plane src="#obj-4" position="0 0 0.042" width="1" height="1"></a-plane>

      <a-plane opt-plane src="#layer5" position="0 0 0.03" width="1" height="1"></a-plane>
       <a-plane opt-plane src="#obj-5" position="0 0 0.032" width="1" height="1"></a-plane>

      <a-plane opt-plane src="#layer6" position="0 0 0.02" width="1" height="1"></a-plane>
       <a-plane opt-plane src="#obj-6" position="0 0 0.022" width="1" height="1"></a-plane>

      <a-plane opt-plane src="#layer7" position="0 0 0.01" width="1" height="1"></a-plane>
      <a-plane opt-plane src="#omino" position="0 0 0.08" width="1" height="1"></a-plane>

    </a-entity>
  </a-scene>
</body>
</html>
